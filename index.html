          while(newFinished.includes(gameState.turnOrder[nextIdx]) && loop < gameState.turnOrder.length) {
              nextIdx = (nextIdx + 1) % gameState.turnOrder.length;
              loop++;
          }
          updateRoom({
              [`gameState.guessedCount.${guesser}`]: newCount,
              [`gameState.revealedLetters.${guesser}`]: 1,
              'gameState.finishedPlayers': newFinished,
              'gameState.phase': 'guessing',
              'gameState.activePlayerIndex': nextIdx,
              'gameState.timerEnd': Date.now() + 30000
          });
      };


      // RENDER: FASE DI CREAZIONE
      if (gameState.phase === 'creation') {
          const isMyCreationDone = !isLocal && gameState.chains[user.uid][0] !== "";
          const activeCreationUid = isLocal ? gameState.turnOrder[localCreationIdx] : user.uid;
          
          if (isMyCreationDone) {
              return (
                 <div className="flex flex-col items-center justify-center p-12 bg-slate-800 rounded-xl h-full shadow-lg border border-slate-700">
                    <i className="fa-solid fa-lock text-emerald-400 text-6xl mb-4"></i>
                    <h3 className="text-2xl font-bold mb-2 text-white">Catena Bloccata!</h3>
                    <p className="text-slate-400">In attesa che gli altri giocatori finiscano di scrivere...</p>
                 </div>
              );
          }

          return (
              <div className="flex flex-col items-center h-full p-4 md:p-8 bg-slate-800 rounded-xl border border-slate-700 overflow-y-auto">
                 <h2 className="text-2xl md:text-3xl font-bold text-amber-400 mb-2 text-center"><i className="fa-solid fa-link mr-2"></i>Crea la tua Catena</h2>
                 <p className="text-slate-300 mb-8 text-center max-w-lg">Scrivi 5 parole logicamente collegate tra di loro. Fai attenzione, se le connessioni non hanno senso subirai delle obiezioni!</p>
                 
                 {isLocal && (
                    <div className="bg-indigo-600/30 border border-indigo-400 px-6 py-2 rounded-full mb-6 font-bold text-lg text-indigo-300 flex items-center gap-3 shadow-lg">
                        <img src={CHARACTERS.find(c=>c.id===players[activeCreationUid]?.character)?.url} className="w-8 h-8 rounded-full border-2" style={{borderColor: players[activeCreationUid]?.color}} />
                        Turno di scrittura: <span className="text-white">{players[activeCreationUid]?.nickname}</span>
                    </div>
                 )}

                 <div className="flex flex-col items-center w-full max-w-sm">
                    {myWords.map((word, idx) => (
                        <div key={idx} className="relative flex flex-col items-center w-full">
                           {idx > 0 && (
                               <div className="h-6 w-2 bg-indigo-500/50 my-1 rounded-full border border-indigo-400/30 shadow-inner"></div>
                           )}
                           <div className="relative flex items-center w-full">
                               <div className="w-10 h-10 rounded-full bg-slate-700 text-amber-400 flex items-center justify-center font-black text-lg absolute -left-5 shadow-lg border-2 border-slate-800 z-10">{idx + 1}</div>
                               <input 
                                  type="text" value={word} onChange={(e) => handleWordChange(idx, e.target.value)}
                                  placeholder={idx === 0 ? "Parola Iniziale (es. SOLE)" : "Collegata alla precedente"}
                                  className="w-full bg-slate-900 border-2 border-slate-600 rounded-xl p-4 pl-8 text-white font-bold focus:border-amber-400 focus:outline-none transition-colors uppercase tracking-wider shadow-inner"
                               />
                           </div>
                        </div>
                    ))}
                 </div>
                 
                 <button onClick={submitWords} className="mt-8 bg-emerald-600 hover:bg-emerald-500 py-4 px-12 rounded-xl font-bold text-xl transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
                    Conferma Catena
                 </button>
              </div>
          );
      }

      // RENDER: GIOCO, OBIEZIONI E VOTI
      const activeUid = gameState.turnOrder[gameState.activePlayerIndex];
      const targetUid = gameState.targets[activeUid];
      const targetChain = gameState.chains[targetUid] || [];
      const currentWordIndex = gameState.guessedCount[activeUid] + 1; // da 1 a 4
      const prevWord = targetChain[currentWordIndex - 1] || "";
      const wordToGuess = targetChain[currentWordIndex] || "";
      
      const isPenaltyTurn = gameState.penalties[activeUid] > 0;

      // Generazione slot per l'impiccato
      const renderWordSlots = () => {
         const revealedLength = gameState.revealedLetters[activeUid] || 1;
         const slots = [];
         for(let i=0; i<wordToGuess.length; i++) {
             if (i < revealedLength) {
                 slots.push(
                     <div key={i} className="w-8 h-10 md:w-12 md:h-14 bg-amber-400 text-amber-900 rounded-md flex items-center justify-center font-black text-2xl md:text-3xl shadow-inner border-b-4 border-amber-600">
                         {wordToGuess[i]}
                     </div>
                 );
             } else {
                 slots.push(
                     <div key={i} className="w-8 h-10 md:w-12 md:h-14 bg-slate-700/50 border-2 border-slate-500 rounded-md flex items-center justify-center font-black text-2xl text-transparent border-b-4">
                         _
                     </div>
                 );
             }
         }
         return <div className="flex flex-wrap justify-center gap-1 md:gap-2">{slots}</div>;
      };

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER PUNTI E TURNI */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-4">
               <div>
                  <h2 className="text-xl font-bold text-indigo-400"><i className="fa-solid fa-link mr-2"></i>Catena di Parole</h2>
                  <p className="text-xs text-slate-400">Round {roomData.currentRound} di {roomData.config.rounds}</p>
               </div>
               {gameState.phase === 'guessing' && !isPenaltyTurn && (
                   <div className={`px-3 py-1 rounded-full border ${timeLeft <= 5 ? 'border-red-500 text-red-500 animate-pulse bg-red-900/20' : 'border-amber-500/50 text-amber-400 bg-amber-900/20'} font-mono font-bold flex items-center gap-2`}>
                       <i className="fa-solid fa-clock"></i> {timeLeft}s
                   </div>
               )}
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {gameState.turnOrder.map(uid => {
                   const hasFinished = finishedPlayers.includes(uid);
                   const isActive = uid === activeUid;
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-2 rounded-lg border-2 flex flex-col items-center min-w-max relative transition-all ${isActive ? 'scale-110 shadow-[0_0_10px_rgba(255,255,255,0.2)]' : 'opacity-70'}`} style={{borderColor: players[uid].color}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full mb-1" />
                          <span className="text-[10px] font-bold">{players[uid].nickname}</span>
                          <div className="text-[9px] text-amber-400 font-bold">{gameState.guessedCount[uid]}/4 Indovinate</div>
                          {hasFinished && <i className="fa-solid fa-flag-checkered absolute -top-2 -right-2 text-white bg-emerald-500 rounded-full p-1 text-[8px]"></i>}
                          {gameState.penalties[uid] > 0 && <i className="fa-solid fa-ban absolute -top-2 -right-2 text-white bg-red-500 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          {/* AREA CENTRALE */}
          <div className="bg-slate-800 flex-1 rounded-xl border border-slate-700 shadow-xl flex flex-col items-center justify-center p-4 md:p-8 relative overflow-hidden">
             
             {/* FASE: INDOVINA */}
             {gameState.phase === 'guessing' && (
                <div className="w-full max-w-3xl text-center">
                   
                   <div className="flex items-center justify-center gap-4 mb-8 bg-slate-900/50 p-4 rounded-2xl border border-slate-600/50 inline-flex shadow-inner">
                      <img src={CHARACTERS.find(c=>c.id===players[targetUid]?.character)?.url} className="w-12 h-12 rounded-full border-2" style={{borderColor: players[targetUid]?.color}} />
                      <div className="text-left">
                          <p className="text-sm text-slate-400 font-bold uppercase tracking-widest leading-tight">La Catena di</p>
                          <p className="text-2xl font-black leading-tight" style={{color: players[targetUid]?.color}}>{players[targetUid]?.nickname}</p>
                      </div>
                   </div>

                   <div className="flex flex-col items-center w-full mb-8">
                       {targetChain.map((word, idx) => {
                           if (!word) return null;
                           const isBase = idx <= gameState.guessedCount[activeUid];
                           const isCurrent = idx === gameState.guessedCount[activeUid] + 1;
                           const isFuture = idx > gameState.guessedCount[activeUid] + 1;

                           return (
                               <React.Fragment key={idx}>
                                   {idx > 0 && <div className="h-6 w-1 bg-slate-600 rounded-full my-1"></div>}
                                   
                                   {isBase && (
                                       <div className="w-full max-w-md bg-emerald-900/30 border-2 border-emerald-500/50 text-emerald-400 font-black p-4 rounded-xl text-xl md:text-2xl tracking-widest flex justify-between items-center shadow-lg">
                                           <span>{word}</span>
                                           <i className="fa-solid fa-check-circle"></i>
                                       </div>
                                   )}
                                   
                                   {isCurrent && (
                                       <div className="w-full max-w-xl flex flex-col items-center my-2 bg-slate-900/50 p-4 md:p-6 rounded-2xl border-2 border-amber-500/30 shadow-[0_0_20px_rgba(251,191,36,0.1)]">
                                           <span className="text-amber-400 font-bold text-xs mb-3 uppercase tracking-widest animate-pulse">Da Indovinare</span>
                                           {renderWordSlots()}
                                       </div>
                                   )}

                                   {isFuture && (
                                       <div className="w-full max-w-md bg-slate-800 border-2 border-dashed border-slate-600 text-slate-500 font-bold p-4 rounded-xl text-lg flex justify-center items-center gap-3">
                                           <i className="fa-solid fa-lock"></i> Parola {idx + 1}
                                       </div>
                                   )}
                               </React.Fragment>
                           );
                       })}
                   </div>

                   {isPenaltyTurn ? (
                       <div className="bg-red-900/40 border-4 border-red-500 p-8 rounded-2xl animate-pulse w-full max-w-md mx-auto">
                          <i className="fa-solid fa-ban text-6xl text-red-500 mb-4"></i>
                          <h2 className="text-3xl font-black text-white">TURNO SALTATO!</h2>
                          <p className="text-red-200 mt-2">Penalità attiva per obiezione accolta.</p>
                       </div>
                   ) : (
                       <div className="w-full max-w-md mx-auto">
                          {((isLocal && activeUid) || (!isLocal && activeUid === user.uid)) ? (
                             <div className="flex gap-2">
                                <input 
                                   type="text" value={guessInput} onChange={(e) => setGuessInput(e.target.value)}
                                   onKeyDown={(e) => e.key === 'Enter' && handleGuessSubmit()}
                                   placeholder="Digita la parola..." autoFocus
                                   className="flex-1 bg-slate-900 border-2 border-indigo-500/50 rounded-xl p-4 text-white font-bold text-xl uppercase tracking-wider focus:outline-none focus:border-indigo-400 shadow-inner"
                                />
                                <button onClick={handleGuessSubmit} className="bg-indigo-600 hover:bg-indigo-500 px-6 rounded-xl font-bold text-2xl shadow-lg transition-transform active:scale-95 border-b-4 border-indigo-800 active:border-b-0 active:translate-y-1">
                                   <i className="fa-solid fa-arrow-right"></i>
                                </button>
                             </div>
                          ) : (
                             <div className="animate-pulse text-lg text-slate-400 font-bold bg-slate-900 p-4 rounded-xl border border-slate-700">
                                <i className="fa-solid fa-keyboard mr-2 text-indigo-400"></i> {players[activeUid]?.nickname} sta scrivendo...
                             </div>
                          )}
                       </div>
                   )}
                </div>
             )}

             {/* FASE: ATTESA OBIEZIONE */}
             {gameState.phase === 'objection_wait' && (
                <div className="w-full max-w-2xl text-center">
                   <h3 className="text-4xl md:text-5xl font-black text-emerald-400 mb-6 drop-shadow-lg">Esatto!</h3>
                   <p className="text-xl text-white mb-4">La parola era proprio <strong className="text-amber-400 uppercase">{gameState.currentGuessInfo.word2}</strong></p>
                   
                   <div className="bg-slate-900 p-6 rounded-xl border-2 border-slate-600 mb-8 flex flex-col md:flex-row items-center justify-center gap-4 text-2xl font-bold shadow-inner">
                      <span className="text-slate-400">{gameState.currentGuessInfo.word1}</span>
                      <i className="fa-solid fa-arrow-right text-indigo-400"></i>
                      <span className="text-amber-400">{gameState.currentGuessInfo.word2}</span>
                   </div>
                   
                   <p className="text-slate-300 font-bold mb-6">Questa connessione logica ha senso?</p>
                   
                   <div className="flex flex-col sm:flex-row gap-4 justify-center">
                      <button onClick={raiseObjection} className="bg-red-600 hover:bg-red-500 py-4 px-8 rounded-xl font-black text-xl shadow-lg hover:-translate-y-1 transition-transform border-b-4 border-red-800 active:border-b-0 active:translate-y-1">
                         <i className="fa-solid fa-gavel mr-2"></i> OBIEZIONE!
                      </button>
                      {isHost && (
                         <button onClick={acceptGuess} className="bg-emerald-600 hover:bg-emerald-500 py-4 px-8 rounded-xl font-black text-xl shadow-lg hover:-translate-y-1 transition-transform border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
                            Ha senso (Continua) <i className="fa-solid fa-arrow-right ml-2"></i>
                         </button>
                      )}
                   </div>
                </div>
             )}

             {/* FASE: VOTO OBIEZIONE */}
             {gameState.phase === 'objection_vote' && (
                <div className="w-full max-w-2xl text-center">
                   <div className="inline-block bg-red-500/20 p-6 rounded-full mb-4 animate-pulse border-4 border-red-500">
                      <i className="fa-solid fa-scale-balanced text-6xl text-red-500"></i>
                   </div>
                   <h3 className="text-3xl font-black text-red-400 mb-2">TRIBUNALE APERTO!</h3>
                   <p className="text-lg text-slate-300 mb-6">La giuria deve votare sulla connessione creata da {players[gameState.currentGuessInfo.creator].nickname}</p>
                   
                   <div className="bg-slate-900 p-6 rounded-xl border border-red-500/50 mb-8 flex items-center justify-center gap-4 text-2xl font-bold">
                      <span className="text-slate-400">{gameState.currentGuessInfo.word1}</span>
                      <i className="fa-solid fa-arrow-right text-indigo-400"></i>
                      <span className="text-amber-400">{gameState.currentGuessInfo.word2}</span>
                   </div>
                   
                   {actualUser.uid !== gameState.currentGuessInfo.creator ? (
                       !gameState.votes?.[actualUser.uid] ? (
                           <div className="flex flex-col sm:flex-row gap-4 justify-center">
                              <button onClick={() => updateRoom({[`gameState.votes.${actualUser.uid}`]: 'yes'})} className="bg-emerald-600 hover:bg-emerald-500 py-4 px-8 rounded-xl font-bold text-white text-lg shadow-lg border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
                                 <i className="fa-solid fa-thumbs-up mr-2"></i> Ha Senso
                              </button>
                              <button onClick={() => updateRoom({[`gameState.votes.${actualUser.uid}`]: 'no'})} className="bg-red-600 hover:bg-red-500 py-4 px-8 rounded-xl font-bold text-white text-lg shadow-lg border-b-4 border-red-800 active:border-b-0 active:translate-y-1">
                                 <i className="fa-solid fa-thumbs-down mr-2"></i> Non c'entra nulla
                              </button>
                           </div>
                       ) : (
                           <div className="text-amber-400 font-bold text-xl animate-pulse"><i className="fa-solid fa-check-circle mr-2"></i> Voto registrato. In attesa della sentenza...</div>
                       )
                   ) : (
                       <div className="bg-slate-900 border-2 border-red-500/50 p-4 rounded-xl text-red-300 font-bold">
                          Sei sotto accusa! Non puoi votare sulla tua stessa parola. Incrocia le dita...
                       </div>
                   )}
                </div>
             )}

             {/* FASE: RISULTATO OBIEZIONE */}
             {gameState.phase === 'objection_result' && (
                <div className="w-full max-w-xl text-center animate-[spinCard_0.5s_ease-out]">
                   <i className={`fa-solid ${gameState.objectionResult === 'accolta' ? 'fa-gavel text-red-500' : 'fa-check-circle text-emerald-500'} text-[80px] mb-6 drop-shadow-lg`}></i>
                   <h3 className="text-4xl font-black text-white mb-4">Obiezione {gameState.objectionResult === 'accolta' ? 'Accolta!' : 'Respinta!'}</h3>
                   
                   {gameState.objectionResult === 'accolta' ? (
                       <p className="text-red-400 font-bold text-xl">
                          Verdetto implacabile! La connessione era inesistente.<br/><br/>
                          <span className="bg-red-900/50 px-4 py-2 rounded-lg border border-red-500">{players[gameState.currentGuessInfo.creator].nickname} salterà i prossimi 2 turni!</span>
                       </p>
                   ) : (
                       <p className="text-emerald-400 font-bold text-xl">
                          Il collegamento ha retto l'accusa. Tutto regolare, si prosegue!
                       </p>
                   )}
                </div>
             )}

          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: TABELLUNO
    // ==========================================
    function TabellUNOGame({ user, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const activePlayerId = gameState.turnOrder[gameState.activePlayerIndex];
      const isMyTurn = user.uid === activePlayerId;
      const activePlayer = players[activePlayerId];
      
      const finishedPlayers = gameState.finishedPlayers || [];
      const isGameOver = finishedPlayers.length >= gameState.turnOrder.length - 1;

      // Audio Utils
      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'draw') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'step') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'special') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.setValueAtTime(900, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'bad') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {}
      };

      // Game Loop: Fine round
      useEffect(() => {
        if (isGameOver && roomData.status === 'playing' && (isLocal || roomData.hostId === user.uid)) {
          let finalFinished = [...finishedPlayers];
          const lastPlayer = gameState.turnOrder.find(id => !finalFinished.includes(id));
          if (lastPlayer && finalFinished.length < gameState.turnOrder.length) finalFinished.push(lastPlayer);
          const results = finalFinished.map((id, index) => ({ id, position: index + 1 }));
          const pointsUpdate = {};
          results.forEach((res, index) => {
            const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
            pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
          });
          updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
        }
      }, [isGameOver, roomData.status, roomData.hostId, user.uid, isLocal, finishedPlayers]);

      // Helper Passa Turno
      const passTurn = (currState) => {
          let nextIdx = currState.activePlayerIndex;
          const dir = currState.direction;
          let skips = [...currState.skippedPlayers];
          let count = 0;
          
          while(count < currState.turnOrder.length) {
              nextIdx = (nextIdx + dir + currState.turnOrder.length) % currState.turnOrder.length;
              const nextUid = currState.turnOrder[nextIdx];
              
              if (currState.finishedPlayers.includes(nextUid)) { count++; continue; }
              if (skips.includes(nextUid)) {
                  skips = skips.filter(id => id !== nextUid); // Consume skip
                  count++; continue;
              }
              break;
          }
          return { nextIdx, skips };
      };

      // Azione: Pesca Carta
      const drawCard = () => {
          if (!isMyTurn || gameState.pendingAction !== null) return;
          playSound('draw');
          
          const colors = ['#EF4444', '#3B82F6', '#EAB308', '#10B981']; // R, B, Y, G
          const isAction = Math.random() < 0.25;
          let card = {};
          
          if (isAction) {
              const actions = ['stop', 'reverse', 'minus_two'];
              card = { type: 'action', value: actions[Math.floor(Math.random() * 3)], color: '#1E293B' };
          } else {
              card = { type: 'number', value: Math.floor(Math.random() * 9) + 1, color: colors[Math.floor(Math.random() * 4)] };
          }

          let updates = { 'gameState.currentCard': card };
          const currentPos = gameState.boards[activePlayerId];

          if (card.type === 'number') {
              let target = currentPos + card.value;
              if (target > 45) target = 45;
              updates['gameState.targetCell'] = target;
              updates['gameState.pendingAction'] = 'click_to_move';
              updates['gameState.isSecondaryMove'] = false;
          } else {
              if (card.value === 'stop') {
                  let target = currentPos + 1;
                  if (target > 45) target = 45;
                  // Trova il prossimo per skipparlo
                  const nextInfo = passTurn(gameState);
                  const nextUidToSkip = gameState.turnOrder[nextInfo.nextIdx];
                  
                  updates['gameState.targetCell'] = target;
                  updates['gameState.skippedPlayers'] = [...gameState.skippedPlayers, nextUidToSkip];
                  updates['gameState.pendingAction'] = 'click_to_move';
                  updates['gameState.isSecondaryMove'] = false;
              } else if (card.value === 'reverse') {
                  const newDir = gameState.direction * -1;
                  const tempState = { ...gameState, direction: newDir };
                  const nextInfo = passTurn(tempState);
                  
                  updates['gameState.direction'] = newDir;
                  updates['gameState.activePlayerIndex'] = nextInfo.nextIdx;
                  updates['gameState.skippedPlayers'] = nextInfo.skips;
                  updates['gameState.pendingAction'] = null;
                  updates['gameState.currentCard'] = null;
                  updates['gameState.isSecondaryMove'] = false;
              } else if (card.value === 'minus_two') {
                  updates['gameState.pendingAction'] = 'select_minus_two';
                  updates['gameState.isSecondaryMove'] = false;
              }
          }
          updateRoom(updates);
      };

      // Azione: Clicca Casella Lampeggiante
      const handleCellClick = (cellIndex) => {
          if (!isMyTurn || gameState.pendingAction !== 'click_to_move' || cellIndex !== gameState.targetCell) return;
          
          updateRoom({ 'gameState.pendingAction': 'animating_movement' });
          
          let current = gameState.boards[activePlayerId];
          const target = gameState.targetCell;
          const step = target > current ? 1 : -1;

          const int = setInterval(() => {
              if (current === target) {
                  clearInterval(int);
                  resolveMovementEnd(target);
              } else {
                  current += step;
                  playSound('step');
                  updateRoom({ [`gameState.boards.${activePlayerId}`]: current });
              }
          }, 300);
      };

      // Logica: Fine Movimento
      const resolveMovementEnd = (finalPos) => {
          let updates = {};
          
          if (finalPos === 45) {
              playSound('special');
              const newFinished = [...gameState.finishedPlayers, activePlayerId];
              updates['gameState.finishedPlayers'] = newFinished;
              
              const nextInfo = passTurn({ ...gameState, finishedPlayers: newFinished });
              updates['gameState.activePlayerIndex'] = nextInfo.nextIdx;
              updates['gameState.skippedPlayers'] = nextInfo.skips;
              updates['gameState.pendingAction'] = null;
              updates['gameState.currentCard'] = null;
              updates['gameState.isSecondaryMove'] = false;
          } else if (gameState.isSecondaryMove) {
              // Movimento causato da un bonus/malus. Ignoriamo la cella e passiamo il turno.
              const nextInfo = passTurn(gameState);
              updates['gameState.activePlayerIndex'] = nextInfo.nextIdx;
              updates['gameState.skippedPlayers'] = nextInfo.skips;
              updates['gameState.pendingAction'] = null;
              updates['gameState.currentCard'] = null;
              updates['gameState.isSecondaryMove'] = false;
          } else if ([5, 15, 25, 35].includes(finalPos)) {
              playSound('special');
              updates['gameState.pendingAction'] = 'plus_two_bonus';
          } else if ([7, 17, 27, 37].includes(finalPos)) {
              playSound('bad');
              updates['gameState.pendingAction'] = 'minus_two_cell';
          } else if (finalPos === 39) {
              playSound('special');
              updates['gameState.pendingAction'] = 'x2_bonus';
          } else if ([10, 20, 30, 40].includes(finalPos)) {
              playSound('special');
              updates['gameState.pendingAction'] = 'guess_uno';
          } else {
              const nextInfo = passTurn(gameState);
              updates['gameState.activePlayerIndex'] = nextInfo.nextIdx;
              updates['gameState.skippedPlayers'] = nextInfo.skips;
              updates['gameState.pendingAction'] = null;
              updates['gameState.currentCard'] = null;
              updates['gameState.isSecondaryMove'] = false;
          }
          updateRoom(updates);
      };

      // Bonus/Malus Azioni
      const handlePlusTwo = () => {
          if (!isMyTurn || gameState.pendingAction !== 'plus_two_bonus') return;
          let target = gameState.boards[activePlayerId] + 2;
          if (target > 45) target = 45;
          updateRoom({ 'gameState.targetCell': target, 'gameState.pendingAction': 'click_to_move', 'gameState.isSecondaryMove': true });
      };

      const handleMinusTwoCell = () => {
          if (!isMyTurn || gameState.pendingAction !== 'minus_two_cell') return;
          let target = gameState.boards[activePlayerId] - 2;
          if (target < 0) target = 0;
          updateRoom({ 'gameState.targetCell': target, 'gameState.pendingAction': 'click_to_move', 'gameState.isSecondaryMove': true });
      };

      const handleX2Bonus = () => {
          if (!isMyTurn || gameState.pendingAction !== 'x2_bonus') return;
          playSound('draw');
          const colors = ['#EF4444', '#3B82F6', '#EAB308', '#10B981'];
          const val = Math.floor(Math.random() * 9) + 1;
          const card = { type: 'number', value: val * 2, color: colors[Math.floor(Math.random() * 4)] };
          let target = gameState.boards[activePlayerId] + card.value;
          if (target > 45) target = 45;
          updateRoom({ 'gameState.currentCard': card, 'gameState.targetCell': target, 'gameState.pendingAction': 'click_to_move', 'gameState.isSecondaryMove': false });
      };

      const handleMinusTwoSelect = (targetUid) => {
          if (!isMyTurn || gameState.pendingAction !== 'select_minus_two') return;
          let targetPos = gameState.boards[targetUid] - 2;
          if (targetPos < 0) targetPos = 0;
          
          const nextInfo = passTurn(gameState);
          updateRoom({
              [`gameState.boards.${targetUid}`]: targetPos,
              'gameState.activePlayerIndex': nextInfo.nextIdx,
              'gameState.skippedPlayers': nextInfo.skips,
              'gameState.pendingAction': null,
              'gameState.currentCard': null
          });
      };

      const handleUnoGuess = (color) => {
          if (!isMyTurn || gameState.pendingAction !== 'guess_uno') return;
          updateRoom({ 'gameState.unoGuess': color, 'gameState.pendingAction': 'draw_uno_card' });
      };

      const handleUnoDraw = () => {
          if (!isMyTurn || gameState.pendingAction !== 'draw_uno_card') return;
          
          const colors = ['#EF4444', '#3B82F6', '#EAB308', '#10B981'];
          const drawnCard = { type: 'number', value: Math.floor(Math.random() * 9) + 1, color: colors[Math.floor(Math.random() * 4)] };
          
          let target;
          if (drawnCard.color === gameState.unoGuess) {
              playSound('special');
              target = gameState.boards[activePlayerId] + drawnCard.value;
              if (target > 45) target = 45;
          } else {
              playSound('bad');
              target = gameState.boards[activePlayerId] - 3;
              if (target < 0) target = 0;
          }
          
          updateRoom({
              'gameState.currentCard': drawnCard,
              'gameState.targetCell': target,
              'gameState.pendingAction': 'click_to_move',
              'gameState.isSecondaryMove': true
          });
      };

      // Costruzione Tabellone a Serpentina
      const boardCells = [];
      for(let i=0; i<=45; i++) boardCells.push(i);
      
      const rows = [];
      for(let i=0; i<=45; i+=10) rows.push(boardCells.slice(i, i+10));
      if (rows[1]) rows[1].reverse();
      if (rows[3]) rows[3].reverse();
      const flatBoard = rows.flat();

      const getCellColorClass = (cell) => {
          if (cell === 45) return 'bg-checkered';
          if ([10, 20, 30, 40].includes(cell)) return 'bg-rainbow';
          if ([5, 15, 25, 35].includes(cell)) return 'bg-emerald-500';
          if ([7, 17, 27, 37].includes(cell)) return 'bg-red-500';
          if (cell === 39) return 'bg-fuchsia-500';
          return 'bg-slate-700';
      };

      const getCardIcon = (card) => {
          if (!card) return null;
          if (card.type === 'number') return <span className="text-4xl font-black">{card.value}</span>;
          if (card.value === 'stop') return <i className="fa-solid fa-ban text-4xl"></i>;
          if (card.value === 'reverse') return <i className="fa-solid fa-arrows-rotate text-4xl"></i>;
          if (card.value === 'minus_two') return <span className="text-4xl font-black">-2</span>;
          return null;
      };

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div className="flex items-center gap-3">
               <i className="fa-solid fa-chess-board text-2xl text-amber-500"></i>
               <div>
                  <h2 className="text-xl font-bold text-white">TabellUNO</h2>
                  <div className="text-xs text-slate-400 flex items-center gap-2">
                     <i className={`fa-solid fa-rotate ${gameState.direction === 1 ? 'fa-flip-horizontal text-emerald-400' : 'text-amber-400'}`}></i>
                     {gameState.direction === 1 ? 'Senso Orario' : 'Senso Antiorario'}
                  </div>
               </div>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {gameState.turnOrder.map(uid => {
                   const hasFinished = finishedPlayers.includes(uid);
                   const isSkipped = gameState.skippedPlayers.includes(uid);
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative ${uid === activePlayerId && !hasFinished ? 'scale-105 border-white shadow-[0_0_10px_rgba(255,255,255,0.2)]' : 'opacity-70'}`} style={{borderColor: players[uid].color}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                          <span className="text-xs font-bold">{players[uid].nickname}</span>
                          {hasFinished && <i className="fa-solid fa-flag-checkered absolute -top-2 -right-2 text-white bg-emerald-500 rounded-full p-1 text-[8px]"></i>}
                          {isSkipped && <i className="fa-solid fa-ban absolute -top-2 -right-2 text-white bg-red-500 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          <div className="flex flex-col lg:flex-row gap-6 flex-1">
             {/* PANNELLO AZIONI */}
             <div className="lg:w-1/3 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col items-center min-h-[350px]">
                {isMyTurn ? (
                   <div className="w-full flex flex-col items-center">
                      <h3 className="text-2xl font-bold text-emerald-400 mb-6">Tocca a te!</h3>
                      
                      {gameState.pendingAction === null && (
                          <button onClick={drawCard} className="w-32 h-48 bg-slate-900 border-4 border-slate-600 rounded-xl shadow-xl flex flex-col items-center justify-center hover:-translate-y-4 hover:border-indigo-400 transition-all group">
                             <div className="bg-indigo-600 w-20 h-20 rounded-full flex items-center justify-center -rotate-12 group-hover:rotate-0 transition-all shadow-inner">
                                <span className="text-white font-black text-xl italic tracking-tighter shadow-sm">UNO</span>
                             </div>
                             <span className="mt-4 font-bold text-slate-400">PESCA</span>
                          </button>
                      )}

                      {gameState.currentCard && (
                          <div className="w-32 h-48 rounded-xl shadow-xl flex items-center justify-center border-4 border-white relative overflow-hidden mb-6 animate-[spinCard_0.4s_ease-out]" style={{ backgroundColor: gameState.currentCard.color }}>
                              <div className="bg-white w-24 h-32 rounded-full absolute -rotate-12 shadow-inner"></div>
                              <div className="z-10 text-white drop-shadow-md" style={{ textShadow: '2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000' }}>
                                 {getCardIcon(gameState.currentCard)}
                              </div>
                          </div>
                      )}

                      {gameState.pendingAction === 'click_to_move' && (
                          <div className="text-center animate-pulse text-amber-400 font-bold">
                              Clicca la casella lampeggiante sul tabellone!
                          </div>
                      )}
                      
                      {gameState.pendingAction === 'animating_movement' && (
                          <div className="text-center text-slate-400 font-bold">
                              In movimento...
                          </div>
                      )}

                      {gameState.pendingAction === 'plus_two_bonus' && (
                          <button onClick={handlePlusTwo} className="bg-emerald-500 hover:bg-emerald-400 text-white font-black px-8 py-4 rounded-xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">
                             BONUS! AVANZA DI +2
                          </button>
                      )}

                      {gameState.pendingAction === 'minus_two_cell' && (
                          <button onClick={handleMinusTwoCell} className="bg-red-500 hover:bg-red-400 text-white font-black px-8 py-4 rounded-xl shadow-lg border-b-4 border-red-700 active:border-b-0 active:translate-y-1">
                             TRAPPOLA! INDIETREGGIA DI -2
                          </button>
                      )}

                      {gameState.pendingAction === 'x2_bonus' && (
                          <button onClick={handleX2Bonus} className="bg-fuchsia-500 hover:bg-fuchsia-400 text-white font-black px-8 py-4 rounded-xl shadow-lg border-b-4 border-fuchsia-700 active:border-b-0 active:translate-y-1">
                             BONUS x2! PESCA CARTA
                          </button>
                      )}

                      {gameState.pendingAction === 'select_minus_two' && (
                          <div className="w-full text-center">
                             <p className="text-red-400 font-bold mb-4">A chi vuoi dare -2 caselle?</p>
                             <div className="flex flex-col gap-2">
                                {gameState.turnOrder.filter(id => id !== activePlayerId && !finishedPlayers.includes(id)).map(uid => (
                                   <button key={uid} onClick={() => handleMinusTwoSelect(uid)} className="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg flex items-center gap-3 border border-slate-500">
                                      <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-8 h-8 rounded-full" />
                                      <span className="font-bold flex-1 text-left">{players[uid].nickname}</span>
                                      <span className="text-red-400 font-black">-2</span>
                                   </button>
                                ))}
                             </div>
                          </div>
                      )}

                      {gameState.pendingAction === 'guess_uno' && (
                          <div className="w-full text-center">
                             <p className="text-amber-400 font-bold mb-4 text-sm">SCOMMESSA UNO! Indovina il colore della prossima carta per avanzare. Se sbagli retrocedi di 3!</p>
                             <div className="grid grid-cols-2 gap-2">
                                <button onClick={()=>handleUnoGuess('#EF4444')} className="bg-[#EF4444] h-12 rounded-lg shadow border-b-4 border-red-900 active:border-b-0"></button>
                                <button onClick={()=>handleUnoGuess('#3B82F6')} className="bg-[#3B82F6] h-12 rounded-lg shadow border-b-4 border-blue-900 active:border-b-0"></button>
                                <button onClick={()=>handleUnoGuess('#EAB308')} className="bg-[#EAB308] h-12 rounded-lg shadow border-b-4 border-yellow-900 active:border-b-0"></button>
                                <button onClick={()=>handleUnoGuess('#10B981')} className="bg-[#10B981] h-12 rounded-lg shadow border-b-4 border-green-900 active:border-b-0"></button>
                             </div>
                          </div>
                      )}

                      {gameState.pendingAction === 'draw_uno_card' && (
                          <button onClick={handleUnoDraw} className="bg-indigo-500 hover:bg-indigo-400 text-white font-black px-8 py-4 rounded-xl shadow-lg border-b-4 border-indigo-700 active:border-b-0 w-full">
                             PESCA PER SCOPRIRE!
                          </button>
                      )}

                   </div>
                ) : (
                   <div className="flex flex-col items-center justify-center h-full opacity-70">
                      <div className="w-20 h-20 rounded-full border-4 mb-4 shadow-lg animate-pulse flex items-center justify-center" style={{ borderColor: activePlayer.color }}>
                         <img src={CHARACTERS.find(c => c.id === activePlayer.character)?.url} className="w-full h-full rounded-full" />
                      </div>
                      <h3 className="text-xl font-bold mb-2 text-center">Turno di {activePlayer.nickname}</h3>
                      <p className="text-slate-400 text-sm text-center">Attendi la sua mossa...</p>
                      
                      {gameState.currentCard && (
                         <div className="mt-6 w-20 h-28 rounded-lg shadow-xl flex items-center justify-center border-2 border-white relative overflow-hidden" style={{ backgroundColor: gameState.currentCard.color }}>
                            <div className="bg-white w-16 h-20 rounded-full absolute -rotate-12 opacity-90"></div>
                            <div className="z-10 text-white text-2xl" style={{ textShadow: '1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000' }}>
                               {getCardIcon(gameState.currentCard)}
                            </div>
                         </div>
                      )}
                   </div>
                )}
             </div>

             {/* TABELLONE */}
             <div className="lg:w-2/3 bg-slate-900 p-4 md:p-6 rounded-xl border-4 flex items-center justify-center shadow-xl overflow-x-auto" style={{ borderColor: isMyTurn ? activePlayer?.color : '#334155' }}>
                <div className="grid grid-cols-10 gap-1 md:gap-2 min-w-[600px] w-full">
                   {flatBoard.map((cellNum) => {
                       const isTarget = gameState.pendingAction === 'click_to_move' && gameState.targetCell === cellNum;
                       
                       const occupants = gameState.turnOrder.filter(uid => gameState.boards[uid] === cellNum && !finishedPlayers.includes(uid));

                       const isPlusTwo = [5, 15, 25, 35].includes(cellNum);
                       const isMinusTwo = [7, 17, 27, 37].includes(cellNum);
                       const isX2 = cellNum === 39;
                       const isUno = [10, 20, 30, 40].includes(cellNum);
                       const isStart = cellNum === 0;
                       const isEnd = cellNum === 45;

                       return (
                           <div key={cellNum} 
                                onClick={() => handleCellClick(cellNum)}
                                className={`aspect-square rounded-md border-2 relative flex items-center justify-center transition-all overflow-hidden ${getCellColorClass(cellNum)} ${isTarget ? 'border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.8)] animate-pulse cursor-pointer z-20 scale-110' : 'border-slate-800'}`}>
                               
                               {isPlusTwo && <div className="absolute inset-0 flex items-center justify-center text-white/50 font-black text-2xl md:text-3xl z-0">+2</div>}
                               {isMinusTwo && <div className="absolute inset-0 flex items-center justify-center text-white/50 font-black text-2xl md:text-3xl z-0">-2</div>}
                               {isX2 && <div className="absolute inset-0 flex items-center justify-center text-white/50 font-black text-2xl md:text-3xl z-0">x2</div>}
                               {isUno && <div className="absolute inset-0 flex items-center justify-center text-white/90 font-black text-lg md:text-2xl italic tracking-tighter drop-shadow-md z-0">UNO</div>}
                               {isStart && <div className="absolute inset-0 flex items-center justify-center text-white/30 font-black text-sm md:text-lg z-0">VIA</div>}
                               {isEnd && <div className="absolute inset-0 flex items-center justify-center text-white/80 z-0"><i className="fa-solid fa-flag-checkered text-2xl md:text-4xl drop-shadow-lg"></i></div>}

                               <span className="absolute top-1 left-1 text-[10px] md:text-xs font-bold text-white/70 z-10 drop-shadow-md">{!isStart && !isEnd ? cellNum : ''}</span>
                               
                               {occupants.map((uid, idx) => {
                                   const isMe = uid === activePlayerId;
                                   const offsetX = occupants.length > 1 ? (idx % 2 === 0 ? -10 : 10) : 0;
                                   const offsetY = occupants.length > 2 ? (idx < 2 ? -10 : 10) : 0;
                                   
                                   return (
                                       <img key={uid} 
                                            src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} 
                                            className={`absolute w-6 h-6 md:w-8 md:h-8 rounded-full border-2 shadow-lg transition-all duration-300 ${isMe ? 'z-30' : 'z-10'}`}
                                            style={{ 
                                                borderColor: players[uid].color,
                                                transform: `translate(${offsetX}px, ${offsetY}px)`,
                                                boxShadow: isMe ? `0 0 10px ${players[uid].color}` : 'none'
                                            }} 
                                       />
                                   )
                               })}
                           </div>
                       );
                   })}
                </div>
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: IL PALLONCINO
    // ==========================================
    function PalloncinoGame({ user, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const isHost = isLocal || roomData.hostId === user.uid;
      const { phase, currentMinigameRound, minigameScores, currentPumps, status, secretLimits, turnOrder } = gameState;

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'pump') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'pop') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(10, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'stand') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
          }
        } catch (e) {}
      };

      // Failsafe Fine Partita Minigioco Globale
      useEffect(() => {
        if (gameState.isGameOver && roomData.status === 'playing' && isHost) {
          const timeout = setTimeout(() => {
            const results = gameState.finishedPlayers.map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3000);
          return () => clearTimeout(timeout);
        }
      }, [gameState.isGameOver, roomData.status, isHost, updateRoom, players, gameState.finishedPlayers]);

      // Host Orchestration: Fine Round del Palloncino
      useEffect(() => {
        if (!isHost || gameState.isGameOver || phase !== 'playing') return;

        const allDone = turnOrder.every(uid => status[uid] !== 'pumping');
        if (allDone) {
            // Calcolo punteggi di fine round
            const newScores = { ...minigameScores };
            const roundRankings = []; // Array per sapere chi ha preso quanti punti questo round
            
            // Ordina i giocatori che si sono fermati (non scoppiati) per numero di pompate (descrescente)
            const stoodPlayers = turnOrder.filter(uid => status[uid] === 'stood')
                                          .sort((a, b) => currentPumps[b] - currentPumps[a]);
            
            // Assegna: 1°=5, 2°=4, 3°=3, ecc.
            let pointsToGive = 5;
            stoodPlayers.forEach(uid => {
                const pts = Math.max(1, pointsToGive); // Minimo 1 punto se ti sei salvato
                newScores[uid] += pts;
                roundRankings.push({ uid, pts, pops: currentPumps[uid], popped: false });
                pointsToGive--;
            });

            // Chi è scoppiato prende 0
            turnOrder.forEach(uid => {
                if (status[uid] === 'popped') {
                    roundRankings.push({ uid, pts: 0, pops: currentPumps[uid], popped: true });
                }
            });

            updateRoom({
                'gameState.phase': 'round_results',
                'gameState.minigameScores': newScores,
                'gameState.lastRoundRankings': roundRankings
            });
        }
      }, [isHost, phase, status, turnOrder, currentPumps, minigameScores, gameState.isGameOver]);

      // Host Orchestration: Passaggio al prossimo round
      useEffect(() => {
          if (!isHost || phase !== 'round_results' || gameState.isGameOver) return;
          
          const to = setTimeout(() => {
              if (currentMinigameRound >= 5) {
                  // Fine di tutti i 5 round: stila classifica finale del minigioco
                  const sorted = [...turnOrder].sort((a,b) => minigameScores[b] - minigameScores[a]);
                  updateRoom({
                      'gameState.finishedPlayers': sorted,
                      'gameState.isGameOver': true
                  });
              } else {
                  // Prepara il nuovo round
                  const newPumps = {};
                  const newStatus = {};
                  const newLimits = {};
                  turnOrder.forEach(uid => {
                      newPumps[uid] = 0;
                      newStatus[uid] = 'pumping';
                      newLimits[uid] = Math.floor(Math.random() * (35 - 15 + 1)) + 15;
                  });

                  updateRoom({
                      'gameState.currentMinigameRound': currentMinigameRound + 1,
                      'gameState.currentPumps': newPumps,
                      'gameState.status': newStatus,
                      'gameState.secretLimits': newLimits,
                      'gameState.phase': 'playing',
                      'gameState.timerEnd': Date.now() + 30000
                  });
              }
          }, 4500); // 4.5 secondi per vedere i risultati del round
          return () => clearTimeout(to);
      }, [isHost, phase, currentMinigameRound, turnOrder, minigameScores, gameState.isGameOver]);

      // Timer UI (Locale)
      const [timeLeft, setTimeLeft] = useState(30);
      useEffect(() => {
        if (phase !== 'playing' || !gameState.timerEnd) {
          setTimeLeft(30);
          return;
        }
        const updateTimer = () => {
          const remain = Math.max(0, Math.ceil((gameState.timerEnd - Date.now()) / 1000));
          setTimeLeft(remain);
        };
        updateTimer();
        const int = setInterval(updateTimer, 200);
        return () => clearInterval(int);
      }, [phase, gameState.timerEnd]);

      // Gestione Timeout (Host)
      useEffect(() => {
        if (!isHost || phase !== 'playing' || !gameState.timerEnd) return;
        
        const checkTimeout = () => {
            if (Date.now() >= gameState.timerEnd) {
                const updates = {};
                let someoneStopped = false;
                turnOrder.forEach(uid => {
                    if (status[uid] === 'pumping') {
                        updates[`gameState.status.${uid}`] = 'stood';
                        someoneStopped = true;
                    }
                });
                
                if (someoneStopped) {
                    playSound('stand');
                    updateRoom(updates);
                }
            }
        };
        const int = setInterval(checkTimeout, 500);
        return () => clearInterval(int);
      }, [isHost, phase, gameState.timerEnd, status, turnOrder, updateRoom]);


      const handlePump = (uid) => {
          if (!isLocal && user.uid !== uid) return;
          if (status[uid] !== 'pumping') return;

          const newPumps = currentPumps[uid] + 1;
          const limit = secretLimits[uid];

          if (newPumps >= limit) {
              playSound('pop');
              updateRoom({
                  [`gameState.currentPumps.${uid}`]: newPumps,
                  [`gameState.status.${uid}`]: 'popped'
              });
          } else {
              playSound('pump');
              updateRoom({ [`gameState.currentPumps.${uid}`]: newPumps });
          }
      };

      const handleStand = (uid) => {
          if (!isLocal && user.uid !== uid) return;
          if (status[uid] !== 'pumping') return;
          if (currentPumps[uid] === 0) return; // Non puoi fermarti a 0

          playSound('stand');
          updateRoom({ [`gameState.status.${uid}`]: 'stood' });
      };

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
             <div>
                <h2 className="text-xl font-bold text-rose-400"><i className="fa-solid fa-burst mr-2"></i>Il Palloncino</h2>
                <p className="text-xs text-slate-400">Round {currentMinigameRound} di 5</p>
             </div>
             
             {phase === 'playing' && (
                 <div className={`px-3 py-1 rounded-full border ${timeLeft <= 5 ? 'border-red-500 text-red-500 animate-pulse bg-red-900/20' : 'border-amber-500/50 text-amber-400 bg-amber-900/20'} font-mono font-bold flex items-center gap-2`}>
                     <i className="fa-solid fa-clock"></i> {timeLeft}s
                 </div>
             )}

             <div className="hidden md:flex gap-2 text-[10px] md:text-xs font-bold text-slate-400">
                <span className="bg-slate-900 px-2 py-1 rounded">1°: 5pt</span>
                <span className="bg-slate-900 px-2 py-1 rounded">2°: 4pt</span>
                <span className="bg-slate-900 px-2 py-1 rounded text-red-400">Scoppio: 0pt</span>
             </div>
          </div>

          {/* MAIN AREA */}
          <div className="flex-1 bg-slate-900 rounded-2xl border-4 border-slate-700 shadow-inner p-4 relative overflow-hidden flex flex-col">
             
             {/* OVERLAY RISULTATI ROUND */}
             {phase === 'round_results' && !gameState.isGameOver && (
                 <div className="absolute inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm animate-[spinCard_0.3s_ease-out]">
                     <h2 className="text-3xl font-black text-white mb-6 uppercase tracking-widest">Risultati Round {currentMinigameRound}</h2>
                     <div className="flex flex-col gap-3 w-full max-w-md">
                         {(gameState.lastRoundRankings || []).map((rank, i) => (
                             <div key={i} className={`flex items-center gap-3 p-3 rounded-xl border-2 ${rank.popped ? 'bg-red-900/40 border-red-500/50' : 'bg-slate-800 border-slate-600'}`}>
                                 <img src={CHARACTERS.find(c=>c.id===players[rank.uid].character)?.url} className="w-10 h-10 rounded-full border-2" style={{borderColor: players[rank.uid].color}} />
                                 <div className="flex-1">
                                     <div className="font-bold text-white">{players[rank.uid].nickname}</div>
                                     <div className="text-xs text-slate-400">{rank.popped ? 'Scoppiato!' : `Fermato a ${rank.pops}`}</div>
                                 </div>
                                 <div className={`text-2xl font-black ${rank.popped ? 'text-red-500' : 'text-emerald-400'}`}>
                                     +{rank.pts}
                                 </div>
                             </div>
                         ))}
                     </div>
                 </div>
             )}

             {/* GRIGLIA GIOCATORI */}
             <div className="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                 {turnOrder.map(uid => {
                     const p = players[uid];
                     const isMe = isLocal || user.uid === uid;
                     const pStat = status[uid];
                     const pumps = currentPumps[uid] || 0;
                     const score = minigameScores[uid] || 0;
                     
                     // Calcolo dimensione e tremolio del palloncino
                     const baseSize = 50;
                     const scaleFactor = 1 + (pumps * 0.08); // Cresce dell'8% ad ogni pump
                     const isHuge = pumps >= 20;
                     
                     return (
                         <div key={uid} className={`bg-slate-800 rounded-2xl p-4 border-2 flex flex-col items-center justify-between transition-all relative
                             ${isMe && pStat === 'pumping' ? 'border-rose-400 shadow-[0_0_15px_rgba(251,113,133,0.2)]' : 'border-slate-700'}`}>
                             
                             <div className="w-full flex justify-between items-start z-20">
                                 <div className="flex items-center gap-2 bg-slate-900/50 px-2 py-1 rounded-lg">
                                     <img src={CHARACTERS.find(c=>c.id===p.character)?.url} className="w-8 h-8 rounded-full border-2" style={{borderColor: p.color}} />
                                     <div className="flex flex-col">
                                         <span className="font-bold text-xs text-white truncate max-w-[80px]">{p.nickname}</span>
                                         <span className="text-[10px] text-amber-400 font-black">{score} PT</span>
                                     </div>
                                 </div>
                                 <div className="bg-slate-900 text-slate-400 font-bold px-3 py-1 rounded-lg border border-slate-600">
                                     {pumps}
                                 </div>
                             </div>

                             {/* ZONA PALLONCINO */}
                             <div className="flex-1 flex items-center justify-center w-full min-h-[150px] relative">
                                 {pStat === 'popped' ? (
                                     <div className="animate-bounce flex flex-col items-center">
                                         <i className="fa-solid fa-burst text-6xl text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]"></i>
                                         <span className="mt-2 text-red-400 font-black uppercase">Scoppiato!</span>
                                     </div>
                                 ) : (
                                     <div className="relative flex flex-col items-center justify-end"
                                          style={{
                                              transform: `scale(${scaleFactor})`,
                                              transition: 'transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                                          }}>
                                         
                                         {/* Palloncino */}
                                         <div className={`relative flex justify-center items-end ${isHuge && pStat === 'pumping' ? 'animate-[shake_0.5s_infinite]' : ''}`}
                                              style={{ 
                                                  width: `${baseSize}px`, 
                                                  height: `${baseSize * 1.2}px`,
                                                  backgroundColor: p.color,
                                                  borderRadius: '50% 50% 50% 50% / 40% 40% 60% 60%',
                                                  boxShadow: `inset -10px -10px 20px rgba(0,0,0,0.3), inset 5px 5px 15px rgba(255,255,255,0.4)`
                                              }}>
                                              
                                              {/* Nodo */}
                                              <div className="absolute -bottom-1 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[8px]"
                                                   style={{ borderBottomColor: p.color }}></div>
                                              
                                              {pStat === 'stood' && (
                                                  <div className="absolute inset-0 flex items-center justify-center">
                                                      <i className="fa-solid fa-lock text-white/50 text-xl drop-shadow-md"></i>
                                                  </div>
                                              )}
                                         </div>
                                     </div>
                                 )}
                             </div>

                             {/* CONTROLLI */}
                             <div className="w-full flex gap-2 mt-4 z-20">
                                 {phase === 'playing' ? (
                                     isMe && pStat === 'pumping' ? (
                                         <>
                                             <button onClick={() => handlePump(uid)} 
                                                     className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl shadow-lg border-b-4 border-rose-800 active:border-b-0 active:translate-y-1 transition-all text-xl">
                                                 GONFIA
                                             </button>
                                             <button onClick={() => handleStand(uid)} disabled={pumps === 0}
                                                     className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-600 disabled:border-slate-800 text-white font-bold py-4 rounded-xl shadow-lg border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1 transition-all text-sm">
                                                 FERMATI
                                             </button>
                                         </>
                                     ) : (
                                         <div className="w-full bg-slate-900/50 py-4 rounded-xl text-center font-bold text-slate-400 border border-slate-700">
                                             {pStat === 'pumping' ? 'Sta gonfiando...' : pStat === 'popped' ? 'BOOM!' : `Salvo a ${pumps}!`}
                                         </div>
                                     )
                                 ) : (
                                     <div className={`w-full py-4 rounded-xl text-center font-black text-white shadow-inner
                                         ${pStat === 'popped' ? 'bg-red-900/50' : 'bg-emerald-900/50'}`}>
                                         {pStat === 'popped' ? 'Eliminato (0pt)' : `Salvo (${pumps})`}
                                     </div>
                                 )}
                             </div>
                             
                             {/* Stili per animazione shake locale */}
                             <style>{`
                                @keyframes shake {
                                    0% { transform: translate(1px, 1px) rotate(0deg); }
                                    10% { transform: translate(-1px, -2px) rotate(-1deg); }
                                    20% { transform: translate(-3px, 0px) rotate(1deg); }
                                    30% { transform: translate(3px, 2px) rotate(0deg); }
                                    40% { transform: translate(1px, -1px) rotate(1deg); }
                                    50% { transform: translate(-1px, 2px) rotate(-1deg); }
                                    60% { transform: translate(-3px, 1px) rotate(0deg); }
                                    70% { transform: translate(3px, 1px) rotate(-1deg); }
                                    80% { transform: translate(-1px, -1px) rotate(1deg); }
                                    90% { transform: translate(1px, 2px) rotate(0deg); }
                                    100% { transform: translate(1px, -2px) rotate(-1deg); }
                                }
                             `}</style>
                         </div>
                     );
                 })}
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: SETTE E MEZZO
    // ==========================================
    function SetteMezzoGame({ user, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const isHost = isLocal || roomData.hostId === user.uid;
      const { phase, minigameRound, scores, hands, status, bankHand, turnOrder } = gameState;

      const getHandScore = (hand) => hand.reduce((sum, c) => sum + c.points, 0);

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'draw') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'bust') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'win') {
            osc.type = 'square'; osc.frequency.setValueAtTime(500, ctx.currentTime);
            osc.frequency.setValueAtTime(800, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {}
      };

      // Failsafe Fine Partita Minigioco
      useEffect(() => {
        if (gameState.isGameOver && roomData.status === 'playing' && isHost) {
          const timeout = setTimeout(() => {
            const results = gameState.finishedPlayers.map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 2000);
          return () => clearTimeout(timeout);
        }
      }, [gameState.isGameOver, roomData.status, isHost, updateRoom, players, gameState.finishedPlayers]);

      // Host Orchestration
      useEffect(() => {
        if (!isHost || gameState.isGameOver) return;

        if (phase === 'playing') {
            const allDone = turnOrder.every(uid => status[uid] !== 'playing');
            if (allDone) {
                updateRoom({ 'gameState.phase': 'bank_turn' });
            }
        } else if (phase === 'bank_turn') {
            const bankScore = getHandScore(bankHand);
            if (bankScore < 5.5) {
                const to = setTimeout(() => {
                    updateRoom({ 'gameState.bankHand': [...bankHand, drawSetteMezzoCard()] });
                }, 1200);
                return () => clearTimeout(to);
            } else {
                const to = setTimeout(() => {
                    const newScores = { ...scores };
                    turnOrder.forEach(uid => {
                        const pScore = getHandScore(hands[uid]);
                        const pStat = status[uid];
                        
                        if (pStat === 'busted') {
                            newScores[uid] -= 0.5;
                        } else if (pScore === 7.5) {
                            newScores[uid] += 2;
                        } else if (bankScore > 7.5) {
                            newScores[uid] += 1.5;
                        } else if (pScore > bankScore) {
                            newScores[uid] += 1.5;
                        }
                        // Else 0 punti (pareggio col banco o sconfitta)
                    });
                    
                    updateRoom({
                        'gameState.phase': 'round_results',
                        'gameState.scores': newScores
                    });
                }, 1500);
                return () => clearTimeout(to);
            }
        } else if (phase === 'round_results') {
            const to = setTimeout(() => {
                if (minigameRound >= 10) {
                    const sorted = [...turnOrder].sort((a,b) => scores[b] - scores[a]);
                    updateRoom({
                        'gameState.finishedPlayers': sorted,
                        'gameState.isGameOver': true
                    });
                } else {
                    const newHands = {};
                    const newStatus = {};
                    turnOrder.forEach(uid => {
                        newHands[uid] = [drawSetteMezzoCard()];
                        newStatus[uid] = 'playing';
                    });
                    updateRoom({
                        'gameState.minigameRound': minigameRound + 1,
                        'gameState.hands': newHands,
                        'gameState.status': newStatus,
                        'gameState.bankHand': [drawSetteMezzoCard()],
                        'gameState.phase': 'playing'
                    });
                }
            }, 4500);
            return () => clearTimeout(to);
        }
      }, [isHost, phase, status, bankHand, minigameRound, scores, gameState.isGameOver, turnOrder]);

      const handleHit = (uid) => {
          if (!isLocal && user.uid !== uid) return;
          if (status[uid] !== 'playing') return;

          playSound('draw');
          const newCard = drawSetteMezzoCard();
          const newHand = [...hands[uid], newCard];
          const newScore = getHandScore(newHand);

          const updates = { [`gameState.hands.${uid}`]: newHand };
          if (newScore > 7.5) {
              playSound('bust');
              updates[`gameState.status.${uid}`] = 'busted';
          } else if (newScore === 7.5) {
              playSound('win');
              updates[`gameState.status.${uid}`] = 'stood';
          }
          updateRoom(updates);
      };

      const handleStand = (uid) => {
          if (!isLocal && user.uid !== uid) return;
          if (status[uid] !== 'playing') return;
          updateRoom({ [`gameState.status.${uid}`]: 'stood' });
      };

      const renderCard = (c, i, isHidden = false) => {
          if (isHidden) {
              return (
                  <div key={`hidden-${i}`} className="w-14 h-20 md:w-16 md:h-24 bg-indigo-900 rounded-lg shadow-[2px_2px_10px_rgba(0,0,0,0.5)] border-2 border-slate-300 flex items-center justify-center absolute animate-[spinCard_0.3s_ease-out]" style={{ left: `${i * 25}px`, zIndex: i }}>
                      <div className="w-full h-full border-2 border-indigo-700/50 rounded flex items-center justify-center bg-indigo-800" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.2) 5px, rgba(0,0,0,0.2) 10px)' }}>
                          <i className="fa-solid fa-money-bill-wave text-indigo-400/30 text-2xl"></i>
                      </div>
                  </div>
              );
          }

          let colorClass = 'text-slate-800';
          if (c.suit === 'Cuori' || c.suit === 'Quadri' || c.suit === 'Coppe' || c.suit === 'Denari') colorClass = 'text-red-600';
          let icon = 'fa-gem';
          if(c.suit === 'Coppe') icon = 'fa-wine-glass';
          if(c.suit === 'Spade') icon = 'fa-khanda';
          if(c.suit === 'Bastoni') icon = 'fa-gavel';

          return (
              <div key={i} className={`w-14 h-20 md:w-16 md:h-24 bg-slate-100 rounded-lg shadow-[2px_2px_10px_rgba(0,0,0,0.5)] border border-slate-300 flex flex-col justify-between p-1.5 md:p-2 absolute animate-[spinCard_0.3s_ease-out]`} style={{ left: `${i * 25}px`, zIndex: i }}>
                  <div className={`text-xs md:text-sm font-black leading-none ${colorClass}`}>{c.name}</div>
                  <div className={`self-center text-lg md:text-2xl ${colorClass}`}><i className={`fa-solid ${icon}`}></i></div>
