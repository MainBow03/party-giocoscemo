                        <p className="text-xs text-slate-400">I giocatori scelgono i minigiochi a turno.</p>
                    </div>
                    <div className={`w-14 h-8 rounded-full transition-colors relative shadow-inner ${isRelayMode ? 'bg-emerald-500' : 'bg-slate-700'}`}>
                        <div className={`absolute top-1 left-1 w-6 h-6 bg-white rounded-full transition-transform shadow ${isRelayMode ? 'translate-x-6' : ''}`}></div>
                    </div>
                </div>
            </div>

            {isRelayMode ? (
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-600 animate-[fadeIn_0.3s_ease-out]">
                    <label className="block text-slate-400 mb-2 font-bold text-sm">Minigiochi scelti per giocatore:</label>
                    <select value={relayGamesPerPlayer} onChange={(e) => setRelayGamesPerPlayer(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white font-bold outline-none focus:border-emerald-500 transition-colors cursor-pointer">
                        {[2, 3, 4, 5].map(n => (
                            <option key={n} value={n}>{n} Minigiochi</option>
                        ))}
                    </select>
                    <p className="text-xs text-amber-400 mt-3"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Verranno giocati fino a {maxPlayers * relayGamesPerPlayer} round.</p>
                </div>
            ) : (
                <div className="animate-[fadeIn_0.3s_ease-out]">
                  <label className="block text-slate-400 mb-2">Numero di Round (da 1 a 15)</label>
                  <div className="mb-4">
                    <select value={rounds} onChange={(e) => handleRoundsChange(Number(e.target.value))} className="w-full md:w-48 bg-slate-900 border border-slate-600 hover:border-slate-400 rounded-lg px-4 py-2 text-white font-bold cursor-pointer transition-colors outline-none focus:border-indigo-500">
                        {Array.from({length: 15}, (_, i) => i + 1).map(n => (
                            <option key={n} value={n}>{n} Round</option>
                        ))}
                    </select>
                  </div>
                  
                  <label className="block text-slate-400 mb-2">Seleziona i Minigiochi:</label>
                  <div className="flex flex-col gap-2 max-h-48 overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-slate-700">
                      {selectedGames.map((gId, idx) => (
                          <div key={idx} className="flex items-center gap-3">
                              <span className="text-sm font-bold text-slate-400 w-16">Round {idx+1}</span>
                              <select value={gId} onChange={(e) => updateRoundGame(idx, e.target.value)} className="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white">
                                  {MINIGAMES.map(g => {
                                      const otherRounds = [];
                                      selectedGames.forEach((selId, sIdx) => {
                                          if (selId === g.id && sIdx !== idx) otherRounds.push(sIdx + 1);
                                      });
                                      const label = otherRounds.length > 0 ? `${g.name} (Già in R${otherRounds.join(', R')})` : g.name;
                                      return <option key={g.id} value={g.id}>{label}</option>;
                                  })}
                              </select>
                          </div>
                      ))}
                  </div>
                </div>
            )}
            
            <div>
              <label className="block text-slate-400 mb-2">Giocatori Massimi</label>
              <div className="flex gap-2 flex-wrap">
                {[2, 3, 4, 5, 6].map(n => (
                  <button key={n} onClick={() => setMaxPlayers(n)} className={`flex-1 min-w-[40px] py-2 rounded-lg border font-bold transition-all ${maxPlayers === n ? 'bg-indigo-600 border-indigo-400 shadow-md' : 'bg-slate-900 border-slate-600 hover:border-slate-400'}`}>{n}</button>
                ))}
              </div>
            </div>
            
            <div className="flex gap-4 pt-4">
              <button onClick={onBack} className="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-bold">Annulla</button>
              <button onClick={() => onCreate({ rounds: isRelayMode ? 0 : rounds, maxPlayers, minigames: isRelayMode ? [] : selectedGames, isRelayMode, relayGamesPerPlayer })} className="flex-[2] bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold shadow-lg">Crea e Vai alla Lobby</button>
            </div>
          </div>
        </div>
      );
    }

    function LobbyView({ user, roomData, roomId, onLeave, updateRoom }) {
      if (!roomData) return null;

      const isHost = roomData.hostId === user.uid;
      const me = roomData.players[user.uid];
      const playersList = Object.values(roomData.players);
      
      const allReady = playersList.every(p => p.character !== null) && playersList.length >= 2;
      const takenCharacters = playersList.filter(p => p.id !== user.uid && p.character).map(p => p.character);

      const handleSelectCharacter = async (charId) => {
        if (takenCharacters.includes(charId)) return;
        updateRoom({ [`players.${user.uid}.character`]: charId });
      };

      const handleColorChange = async (color) => {
        updateRoom({ [`players.${user.uid}.color`]: color });
      };

      const handleAddBot = () => {
        if (!isHost || playersList.length >= roomData.config.maxPlayers) return;
        
        const botId = 'bot_' + Math.random().toString(36).substring(2, 9);
        const randomName = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)] + ' ' + Math.floor(Math.random()*99);
        
        const availableChars = CHARACTERS.filter(c => !playersList.map(p=>p.character).includes(c.id));
        const randomChar = availableChars.length > 0 ? availableChars[Math.floor(Math.random() * availableChars.length)].id : CHARACTERS[0].id;
        
        const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);

        updateRoom({
            [`players.${botId}`]: {
                id: botId, nickname: randomName, character: randomChar, color: randomColor, totalScore: 0, isReady: true, isBot: true
            }
        });
      };

      const handleRemoveBot = (botId) => {
        if (!isHost) return;
        const newPlayers = { ...roomData.players };
        delete newPlayers[botId];
        updateRoom({ players: newPlayers });
      };

      const startGame = async () => {
        if (!isHost || !allReady) return;
        const playerIds = Object.keys(roomData.players);
        
        if (roomData.config.isRelayMode) {
            updateRoom({
                status: 'relay_draft',
                draftState: {
                    turnOrder: playerIds.sort(() => Math.random() - 0.5), // L'ordine del draft è sempre mescolato
                    currentIndex: 0,
                    round: 1,
                    maxRounds: roomData.config.relayGamesPerPlayer,
                    selectedGames: []
                }
            });
        } else {
            const initialState = getInitialGameState(roomData.config.minigames[0], playerIds, true);
            updateRoom({
              status: 'instructions',
              gameState: initialState
            });
        }
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(roomId).catch(() => {
          const el = document.createElement('textarea');
          el.value = roomId; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        });
        alert("Codice copiato: " + roomId);
      };

      return (
        <div className="grid md:grid-cols-4 gap-6">
          <div className="md:col-span-1 bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col shadow-lg">
            <div className="mb-4">
              <h3 className="font-bold text-lg border-b border-slate-700 pb-2 flex items-center justify-between">
                  <span>Lobby</span>
                  <span className="text-slate-400 text-sm">({playersList.length}/{roomData.config.maxPlayers})</span>
              </h3>
              <div className="mt-2 text-sm bg-slate-900 p-2 rounded flex justify-between items-center cursor-pointer hover:bg-slate-700 border border-slate-600 shadow-inner transition-colors" onClick={copyToClipboard}>
                <span>Codice: <strong className="font-mono text-indigo-400 text-lg tracking-widest">{roomId}</strong></span>
                <span className="text-xs text-slate-500"><i className="fa-solid fa-copy"></i> Copia</span>
              </div>
            </div>
            <div className="flex-1 space-y-3">
              {playersList.map(p => {
                const charObj = CHARACTERS.find(c => c.id === p.character);
                return (
                  <div key={p.id} className="flex items-center gap-3 bg-slate-900 p-2 rounded-lg border shadow-sm relative group" style={{ borderColor: p.color }}>
                    {charObj ? <img src={charObj.url} className="w-10 h-10 rounded-full border-2" style={{ borderColor: p.color }} /> : <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-xs border border-slate-500">?</div>}
                    <div className="flex-1 overflow-hidden">
                      <div className="font-bold truncate text-sm flex items-center gap-1 text-white">
                        {p.id === roomData.hostId && <i className="fa-solid fa-crown text-[14px] text-yellow-400"></i>} 
                        {p.isBot && <i className="fa-solid fa-robot text-sky-400 text-[12px]" title="BOT IA"></i>}
                        {p.nickname} {p.id === user.uid ? '(Tu)' : ''}
                      </div>
                      <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{charObj ? 'Pronto' : 'Scegliendo...'}</div>
                    </div>
                    {isHost && p.isBot && (
                        <button onClick={() => handleRemoveBot(p.id)} className="absolute right-2 text-red-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i className="fa-solid fa-user-minus"></i>
                        </button>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="mt-4 pt-4 border-t border-slate-700">
              {isHost && playersList.length < roomData.config.maxPlayers && (
                 <button onClick={handleAddBot} className="w-full py-2 mb-3 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-bold text-sky-300 border border-sky-900/50 flex items-center justify-center gap-2 transition-all">
                    <i className="fa-solid fa-robot"></i> Aggiungi Bot IA
                 </button>
              )}
              {isHost ? (
                <button onClick={startGame} disabled={!allReady} className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg border-b-4 active:border-b-0 active:translate-y-1 ${allReady ? 'bg-emerald-600 hover:bg-emerald-500 border-emerald-800' : 'bg-slate-600 cursor-not-allowed opacity-50 border-slate-800'}`}>
                  <i className="fa-solid fa-play text-[20px]"></i> Avvia Partita
                </button>
              ) : (
                <div className="text-center text-sm font-bold text-slate-400 p-3 bg-slate-900 rounded-xl border border-slate-600 shadow-inner">
                   {allReady ? <span className="animate-pulse">In attesa dell'host...</span> : "Attendi che tutti scelgano."}
                </div>
              )}
              <button onClick={onLeave} className="w-full mt-3 py-2 text-sm text-red-400 hover:text-red-300 font-bold underline underline-offset-2">Esci dalla stanza</button>
            </div>
          </div>

          <div className="md:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
            <h2 className="text-xl font-bold mb-4 text-center text-white border-b border-slate-700 pb-2">Scegli il tuo Personaggio</h2>
            <div className="grid grid-cols-3 sm:grid-cols-4 gap-4 max-h-[500px] overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-slate-700">
              {CHARACTERS.map(char => {
                const isTaken = takenCharacters.includes(char.id);
                const isMine = me?.character === char.id;
                return (
                  <button key={char.id} onClick={() => handleSelectCharacter(char.id)} disabled={isTaken}
                    className={`relative aspect-square rounded-xl overflow-hidden border-4 transition-all duration-200 shadow-md ${isMine ? 'border-emerald-500 scale-105 shadow-[0_0_15px_rgba(16,185,129,0.5)] z-10' : isTaken ? 'border-slate-800 opacity-30 grayscale cursor-not-allowed' : 'border-transparent hover:border-indigo-400 hover:scale-105'}`}
                  >
                    <img src={char.url} className="w-full h-full object-cover" />
                    {isMine && <div className="absolute inset-0 bg-emerald-500/20 flex items-center justify-center backdrop-blur-[1px]"><i className="fa-solid fa-check text-[32px] text-white drop-shadow-md"></i></div>}
                    {isTaken && <div className="absolute inset-0 flex items-center justify-center"><i className="fa-solid fa-xmark text-[32px] text-red-500 drop-shadow-md"></i></div>}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="md:col-span-1 bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col items-center shadow-lg">
            <h2 className="text-xl font-bold mb-6 text-center text-white border-b border-slate-700 pb-2 w-full">Il tuo Colore</h2>
            <div className="w-32 h-32 rounded-full border-8 shadow-[0_0_20px_rgba(0,0,0,0.5)] mb-6 flex items-center justify-center transition-colors relative" style={{ borderColor: me?.color, backgroundColor: me?.color + '40' }}>
               {me?.character ? (
                   <img src={CHARACTERS.find(c=>c.id === me.character)?.url} className="w-24 h-24 rounded-full object-cover shadow-inner" />
               ) : (
                   <i className="fa-solid fa-user-astronaut text-[48px] text-slate-400"></i>
               )}
            </div>
            <input type="color" value={me?.color || '#3B82F6'} onChange={(e) => handleColorChange(e.target.value)} className="w-full h-14 rounded-xl cursor-pointer bg-slate-900 border border-slate-600 shadow-inner" />
            <p className="text-xs text-slate-400 mt-4 text-center">Tocca la barra per scegliere il colore che ti rappresenterà in gioco!</p>
          </div>
        </div>
      );
    }

    function RelayDraftView({ user, roomData, updateRoom, isLocal }) {
        const { draftState, players, config } = roomData;
        if (!draftState) return null;

        const { turnOrder, currentIndex, round, maxRounds, selectedGames } = draftState;
        const activeUid = turnOrder[currentIndex];
        
        // In locale chiunque può cliccare, in online solo a chi tocca
        const isMyTurn = isLocal ? true : user.uid === activeUid;
        const activePlayer = players[activeUid];

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'select') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'finish') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.2); osc.frequency.setValueAtTime(800, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
                    osc.start(); osc.stop(ctx.currentTime + 0.6);
                }
            } catch (e) {}
        };

        const handleSelect = (gameId) => {
            if (!isMyTurn) return;
            if (selectedGames.some(g => g.gameId === gameId)) return;

            playSound('select');
            const newSelected = [...selectedGames, { gameId, picker: activeUid }];
            
            let nextIdx = currentIndex + 1;
            let nextRound = round;

            if (nextIdx >= turnOrder.length) {
                nextIdx = 0;
                nextRound++;
            }

            if (nextRound > maxRounds || newSelected.length >= MINIGAMES.length) {
                // Draft Completato!
                playSound('finish');
                const gameIds = newSelected.map(g => g.gameId);
                const initialState = getInitialGameState(gameIds[0], turnOrder, true);
                
                // Mettiamo un piccolo delay per far vedere l'ultima selezione
                setTimeout(() => {
                    updateRoom({
                        status: 'instructions',
                        'config.rounds': gameIds.length,
                        'config.minigames': gameIds,
                        draftState: null,
                        gameState: initialState
                    });
                }, 1000);
                
                // Aggiorniamo intanto la selezione a schermo
                updateRoom({ 'draftState.selectedGames': newSelected });
            } else {
                updateRoom({
                    'draftState.selectedGames': newSelected,
                    'draftState.currentIndex': nextIdx,
                    'draftState.round': nextRound
                });
            }
        };

        return (
            <div className="max-w-6xl mx-auto mt-6 flex flex-col h-[calc(100vh-100px)]">
                {/* Header Draft */}
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl mb-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-3xl font-black text-emerald-400 mb-1"><i className="fa-solid fa-list-check mr-2"></i>Staffetta Minigiochi</h2>
                            <p className="text-slate-400 font-bold">Round {Math.min(round, maxRounds)} di {maxRounds}</p>
                        </div>
                        <div className="flex items-center gap-4 bg-slate-900 px-6 py-3 rounded-xl border border-slate-600 shadow-inner">
                            <span className="text-slate-400 uppercase tracking-widest text-xs font-bold">Tocca a:</span>
                            <div className="flex items-center gap-3">
                                <img src={CHARACTERS.find(c => c.id === activePlayer.character)?.url} className="w-10 h-10 rounded-full border-2 animate-pulse shadow-[0_0_15px_rgba(255,255,255,0.2)]" style={{borderColor: activePlayer.color}} />
                                <span className="text-xl font-black text-white drop-shadow-md">{activePlayer.nickname}</span>
                            </div>
                        </div>
                    </div>
                    
                    {/* Ordine dei turni visuale */}
                    <div className="flex gap-2 mt-6 overflow-x-auto pb-2 scrollbar-thin scrollbar-thumb-slate-600">
                        {turnOrder.map((uid, idx) => {
                            const p = players[uid];
                            const isActive = idx === currentIndex;
                            
                            // Conta quante scelte ha già fatto
                            const picksMade = selectedGames.filter(g => g.picker === uid).length;

                            return (
                                <div key={uid} className={`flex items-center gap-2 px-3 py-2 rounded-lg border-2 transition-all min-w-max ${isActive ? 'scale-105 border-white shadow-[0_0_10px_rgba(255,255,255,0.2)] bg-slate-700' : 'border-slate-700 opacity-60 bg-slate-900'}`} style={{borderColor: isActive ? p.color : '#334155'}}>
                                    <img src={CHARACTERS.find(c=>c.id===p.character)?.url} className="w-8 h-8 rounded-full" />
                                    <div className="flex flex-col">
                                        <span className="text-xs font-bold text-white">{p.nickname}</span>
                                        <span className="text-[10px] text-amber-400 font-black">{picksMade}/{maxRounds} Scelti</span>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>

                {/* Griglia Minigiochi */}
                <div className="flex-1 overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-slate-700 pb-10">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {MINIGAMES.map(game => {
                            const selectionInfo = selectedGames.find(g => g.gameId === game.id);
                            const isSelected = !!selectionInfo;
                            const picker = selectionInfo ? players[selectionInfo.picker] : null;

                            return (
                                <button key={game.id} onClick={() => handleSelect(game.id)} disabled={isSelected || !isMyTurn}
                                    className={`relative p-4 rounded-xl border-2 text-left transition-all flex flex-col h-full min-h-[160px] shadow-md
                                        ${isSelected ? 'bg-slate-900 border-slate-700 opacity-80 grayscale-[30%] cursor-not-allowed' : 
                                          !isMyTurn ? 'bg-slate-800 border-slate-600 opacity-90 cursor-default' : 
                                          'bg-slate-800 border-slate-500 hover:border-emerald-400 hover:shadow-[0_0_15px_rgba(52,211,153,0.3)] hover:-translate-y-1 cursor-pointer active:scale-95'}`}
                                >
                                    <div className="flex items-center gap-3 mb-3 border-b border-slate-700 pb-3">
                                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i className={`${game.icon} text-xl w-6 text-center`}></i></div>
                                        <h3 className="font-bold text-white leading-tight flex-1 text-lg">{game.name}</h3>
                                    </div>
                                    <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed">{game.description}</p>
                                    
                                    {isSelected && picker && (
                                        <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-[2px] rounded-xl flex flex-col items-center justify-center z-10 border-2 animate-[fadeIn_0.2s_ease-out]" style={{borderColor: picker.color}}>
                                            <div className="bg-slate-800 rounded-full p-1 mb-2 border-2 shadow-lg" style={{borderColor: picker.color}}>
                                                <img src={CHARACTERS.find(c=>c.id===picker.character)?.url} className="w-14 h-14 rounded-full" />
                                            </div>
                                            <span className="text-white font-bold text-xs bg-black/60 px-3 py-1.5 rounded-full border border-slate-600">Scelto da {picker.nickname}</span>
                                        </div>
                                    )}
                                </button>
                            )
                        })}
                    </div>
                </div>
            </div>
        )
    }

    function InstructionsView({ user, roomData, updateRoom, isLocal, originalUser }) {
      const actualUser = isLocal ? originalUser : user;
      const isHost = isLocal || roomData.hostId === actualUser.uid;
      const gameId = roomData.gameState.gameId;
      const gameInfo = MINIGAMES.find(g => g.id === gameId);

      const startMinigame = () => {
        if (!isHost) return;
        updateRoom({ status: 'playing' });
      };

      if (!gameInfo) return null;

      return (
        <div className="max-w-3xl mx-auto mt-10 bg-slate-800 p-8 md:p-12 rounded-2xl border border-slate-700 shadow-2xl text-center animate-[fadeIn_0.5s_ease-out]">
          <div className="bg-slate-900/50 inline-block p-6 rounded-full mb-6 border-4 border-indigo-500/30 shadow-inner">
             <i className={`${gameInfo.icon} text-6xl text-indigo-400`}></i>
          </div>
          <h2 className="text-4xl md:text-5xl font-black mb-2 text-white drop-shadow-md">{gameInfo.name}</h2>
          <p className="text-indigo-300 font-bold tracking-widest uppercase text-sm mb-10 bg-indigo-900/30 inline-block px-4 py-1 rounded-full border border-indigo-500/50">
             Round {roomData.currentRound} di {roomData.config.rounds}
          </p>
          
          <div className="bg-slate-900 p-6 md:p-8 rounded-xl border border-slate-600 mb-10 text-left relative overflow-hidden shadow-inner">
            <div className="absolute top-0 left-0 w-2 h-full bg-amber-400"></div>
            <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-circle-info"></i> Come si gioca:
            </h3>
            <p className="text-slate-200 text-lg md:text-xl leading-relaxed">
              {gameInfo.description}
            </p>
          </div>

          {isHost ? (
            <button onClick={startMinigame} className="w-full md:w-auto px-12 bg-emerald-600 hover:bg-emerald-500 hover:scale-105 py-4 rounded-xl font-bold text-xl transition-all shadow-lg flex items-center justify-center gap-3 mx-auto border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
              Tutti Pronti! Inizia <i className="fa-solid fa-play"></i>
            </button>
          ) : (
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center shadow-inner">
               <i className="fa-solid fa-spinner animate-spin text-3xl text-indigo-400 mb-3"></i>
               <span className="text-slate-400 font-bold">In attesa che l'host avvii il minigioco...</span>
            </div>
          )}
        </div>
      );
    }

    function GameCoordinator({ user, roomData, roomId, updateRoom, isLocal, originalUser }) {
      const gameState = roomData.gameState;
      if (!gameState) return null;

      if (gameState.gameId === 'fabbrica_dadi') {
        return <FabbricaDadiGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'scaccia_numeri') {
        return <ScacciaNumeriGame user={user} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'palloncino') {
        return <PalloncinoGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'sette_mezzo') {
        return <SetteMezzoGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'cassafortiere') {
        return <CassafortiereGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'sentiero_invisibile') {
        return <SentieroInvisibileGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'collega_punti') {
        return <CollegaPuntiGame user={user} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'snake_ladders') {
        return <SnakeLaddersGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'ricordello') {
        return <RicordelloGame user={user} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'carta_alta') {
        return <CartaAltaGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'tabellUNO') {
        return <TabellUNOGame user={user} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'catena_parole') {
        return <CatenaParoleGame user={isLocal ? user : originalUser} originalUser={originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'corsa_cavalli') {
        return <CorsaCavalliGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'indovina_numero') {
        return <IndovinaNumeroGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'spara_123') {
        return <Spara123Game user={isLocal ? user : originalUser} originalUser={originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'bombe_gogo') {
        return <BombeAGoGoGame user={isLocal ? user : originalUser} originalUser={originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'passa_asso') {
        return <PassaAssoGame user={isLocal ? user : originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'chiappe_avide') {
        return <ChiappeAvideGame user={isLocal ? user : originalUser} originalUser={originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      if (gameState.gameId === 'roulette_dadi') {
        return <RouletteDadiGame user={isLocal ? user : originalUser} originalUser={originalUser} roomData={roomData} roomId={roomId} updateRoom={updateRoom} isLocal={isLocal} />;
      }
      
      return <div>Minigioco sconosciuto</div>;
    }

    // ==========================================
    // MINIGIOCO: ROULETTE A DADI
    // ==========================================
    function RouletteDadiGame({ user, originalUser, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const actualUser = isLocal ? originalUser : user;
      const isHost = isLocal || roomData.hostId === actualUser.uid;
      
      const { phase, counter, direction, tokens, deadPlayers, finishedPlayers, turnOrder, pendingRoll, actionLog } = gameState;
      const activePlayerId = isLocal ? turnOrder[gameState.activePlayerIndex] : actualUser.uid;
      const isMyTurn = isLocal ? true : actualUser.uid === activePlayerId;
      const activePlayer = players[turnOrder[gameState.activePlayerIndex]];
      
      const activePlayersList = turnOrder.filter(uid => !deadPlayers.includes(uid));
      const isGameOver = gameState.isGameOver || activePlayersList.length <= 1;

      const [displayRoll, setDisplayRoll] = useState(0);

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'roll') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300 + Math.random()*200, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'tick') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.start(); osc.stop(ctx.currentTime + 0.05);
          } else if (type === 'explosion') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, ctx.currentTime); osc.frequency.linearRampToValueAtTime(10, ctx.currentTime + 1);
            gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
            osc.start(); osc.stop(ctx.currentTime + 1);
          } else if (type === 'token') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.setValueAtTime(900, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {}
      };

      const getNextIdx = (currIdx, dir, deadList) => {
          let next = currIdx;
          let count = 0;
          do {
              next = (next + dir + turnOrder.length) % turnOrder.length;
              count++;
          } while (deadList.includes(turnOrder[next]) && count < turnOrder.length);
          return next;
      };

      // Animazione Lancio Dado Locale
      useEffect(() => {
          if (phase === 'rolling' && pendingRoll) {
              let counter = 0;
              const int = setInterval(() => {
                  setDisplayRoll(Math.floor(Math.random() * 6) + 1);
                  playSound('roll');
                  counter++;
                  if (counter >= 15) {
                      clearInterval(int);
                      setDisplayRoll(pendingRoll);
                  }
              }, 80);
              return () => clearInterval(int);
          } else {
              setDisplayRoll(0);
          }
      }, [phase, pendingRoll]);

      // Host Orchestration: Risoluzione Fase Lancio
      useEffect(() => {
          if (!isHost || isGameOver) return;
          if (phase === 'rolling') {
              const to = setTimeout(() => {
                  const newCounter = counter + pendingRoll;
                  if (newCounter > 21) {
                      playSound('explosion');
                      updateRoom({
                          'gameState.phase': 'exploded',
                          'gameState.counter': newCounter,
                          'gameState.actionLog': `BOOM! ${activePlayer.nickname} è esploso!`
                      });
                  } else {
                      playSound('tick');
                      updateRoom({
                          'gameState.phase': 'playing',
                          'gameState.counter': newCounter,
                          'gameState.activePlayerIndex': getNextIdx(gameState.activePlayerIndex, direction, deadPlayers),
                          'gameState.actionLog': `${activePlayer.nickname} ha aggiunto ${pendingRoll}.`
                      });
                  }
              }, 1800); // 1.5s per l'animazione del dado + pausa
              return () => clearTimeout(to);
          }
          if (phase === 'exploded') {
              const to = setTimeout(() => {
                  let newDead = [...deadPlayers, turnOrder[gameState.activePlayerIndex]];
                  let newFinished = [...finishedPlayers, turnOrder[gameState.activePlayerIndex]];
                  
                  const stillAlive = turnOrder.filter(uid => !newDead.includes(uid));
                  if (stillAlive.length <= 1) {
                      updateRoom({
                          'gameState.deadPlayers': newDead,
                          'gameState.finishedPlayers': newFinished,
                          'gameState.isGameOver': true,
                          'gameState.actionLog': 'Il gioco è terminato!'
                      });
                  } else {
                      updateRoom({
                          'gameState.deadPlayers': newDead,
                          'gameState.finishedPlayers': newFinished,
                          'gameState.counter': 0, // La bomba si resetta
                          'gameState.phase': 'playing',
                          'gameState.activePlayerIndex': getNextIdx(gameState.activePlayerIndex, direction, newDead),
                          'gameState.actionLog': 'La bomba è stata resettata a 0.'
                      });
                  }
              }, 3000); // Mostra l'esplosione per 3 secondi
              return () => clearTimeout(to);
          }
      }, [isHost, phase, isGameOver, counter, pendingRoll, activePlayer, gameState.activePlayerIndex, direction, deadPlayers, finishedPlayers, turnOrder, updateRoom]);

      // Failsafe Fine Partita Minigioco Globale
      useEffect(() => {
        if (isGameOver && roomData.status === 'playing' && isHost) {
          const timeout = setTimeout(() => {
            let finalFinished = [...finishedPlayers];
            const lastPlayer = turnOrder.find(id => !finalFinished.includes(id));
            if (lastPlayer && finalFinished.length < turnOrder.length) finalFinished.push(lastPlayer);
            
            // Per Roulette a Dadi, chi muore per primo è in fondo. finishedPlayers li ha in ordine di morte.
            // Quindi reverse per dare i punti (l'ultimo sopravvissuto prende il 1° posto).
            const results = finalFinished.reverse().map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3000);
          return () => clearTimeout(timeout);
        }
      }, [isGameOver, roomData.status, isHost, updateRoom, players, finishedPlayers, turnOrder]);

      const handleRoll = () => {
          if (!isMyTurn || phase !== 'playing') return;
          const roll = Math.floor(Math.random() * 6) + 1;
          updateRoom({
              'gameState.phase': 'rolling',
              'gameState.pendingRoll': roll,
              'gameState.actionLog': `${activePlayer.nickname} lancia il dado...`
          });
      };

      const handleSkip = () => {
          if (!isMyTurn || phase !== 'playing' || tokens[activePlayerId] <= 0) return;
          playSound('token');
          updateRoom({
              [`gameState.tokens.${activePlayerId}`]: 0,
              'gameState.activePlayerIndex': getNextIdx(gameState.activePlayerIndex, direction, deadPlayers),
              'gameState.actionLog': `${activePlayer.nickname} ha usato il Gettone per saltare il turno!`
          });
      };

      const handleReverse = () => {
          if (!isMyTurn || phase !== 'playing' || tokens[activePlayerId] <= 0) return;
          playSound('token');
          const newDir = direction * -1;
          updateRoom({
              [`gameState.tokens.${activePlayerId}`]: 0,
              'gameState.direction': newDir,
              'gameState.activePlayerIndex': getNextIdx(gameState.activePlayerIndex, newDir, deadPlayers),
              'gameState.actionLog': `${activePlayer.nickname} ha usato il Gettone per invertire il giro!`
          });
      };

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div className="flex items-center gap-3">
               <i className="fa-solid fa-bomb text-2xl text-rose-500 animate-pulse"></i>
               <div>
                  <h2 className="text-xl font-bold text-white">Roulette a Dadi</h2>
                  <div className="text-xs text-slate-400 flex items-center gap-2">
                     <i className={`fa-solid fa-rotate ${direction === 1 ? 'fa-flip-horizontal text-emerald-400' : 'text-amber-400'}`}></i>
                     {direction === 1 ? 'Giro Orario' : 'Giro Antiorario'}
                  </div>
               </div>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {turnOrder.map(uid => {
                   const isDead = deadPlayers.includes(uid);
                   const isMe = uid === turnOrder[gameState.activePlayerIndex];
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative transition-all ${isDead ? 'opacity-40 grayscale scale-95' : isMe ? 'scale-105 border-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.3)]' : 'border-slate-700'}`} style={!isDead && !isMe ? {borderColor: players[uid].color} : {}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                          <div className="flex flex-col">
                             <span className={`text-[10px] font-bold ${isDead ? 'line-through text-slate-500' : 'text-white'}`}>{players[uid].nickname}</span>
                             <span className="text-[9px] text-amber-400 font-black">
                                 {tokens[uid] > 0 ? <><i className="fa-solid fa-coins mr-1"></i>1 Gettone</> : <span className="text-slate-500">Nessun Gettone</span>}
                             </span>
                          </div>
                          {isDead && <i className="fa-solid fa-skull absolute -top-2 -right-2 text-white bg-slate-700 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          <div className="flex-1 bg-slate-900 rounded-2xl border-4 border-slate-700 shadow-inner flex flex-col lg:flex-row overflow-hidden relative">
             
             {/* Log Azioni */}
             <div className="absolute top-0 left-0 right-0 bg-slate-800/80 p-2 text-center text-slate-300 font-bold text-sm z-20 border-b border-slate-700 backdrop-blur-sm">
                 {actionLog}
             </div>

             {/* CONSOLE CONTROLLI */}
             <div className="lg:w-1/3 bg-slate-800 p-6 border-r border-slate-700 shadow-lg flex flex-col items-center justify-center min-h-[300px] mt-8 lg:mt-0 z-10">
                {isMyTurn && phase === 'playing' ? (
                   <div className="w-full flex flex-col items-center text-center">
                      <h3 className="text-2xl font-black text-rose-400 mb-6 animate-pulse">Tocca a te!</h3>
                      
                      <button onClick={handleRoll} className="w-full bg-rose-600 hover:bg-rose-500 text-white px-8 py-5 rounded-xl shadow-[0_0_20px_rgba(225,29,72,0.4)] border-b-4 border-rose-800 active:border-b-0 font-black text-2xl transition-all mb-6 flex flex-col items-center justify-center gap-2">
                         <i className="fa-solid fa-dice text-4xl"></i>
                         LANCIA DADO
                      </button>

                      <div className="w-full border-t border-slate-600 pt-6">
                         <p className="text-sm text-slate-400 font-bold mb-3 uppercase tracking-widest">Azioni Salvezza</p>
                         {tokens[activePlayerId] > 0 ? (
                             <div className="flex gap-2">
                                 <button onClick={handleSkip} className="flex-1 bg-amber-500 hover:bg-amber-400 text-amber-900 font-black py-3 rounded-lg shadow-md border-b-4 border-amber-700 active:border-b-0 transition-all flex flex-col items-center justify-center gap-1">
                                     <i className="fa-solid fa-forward-step"></i>
                                     <span className="text-xs">SALTA</span>
                                 </button>
                                 <button onClick={handleReverse} className="flex-1 bg-sky-500 hover:bg-sky-400 text-sky-900 font-black py-3 rounded-lg shadow-md border-b-4 border-sky-700 active:border-b-0 transition-all flex flex-col items-center justify-center gap-1">
                                     <i className="fa-solid fa-rotate-left"></i>
                                     <span className="text-xs">INVERTI</span>
                                 </button>
                             </div>
                         ) : (
                             <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 text-slate-500 font-bold text-sm">
                                 Hai già usato il tuo Gettone Salvezza!
                             </div>
                         )}
                      </div>
                   </div>
                ) : (
                   <div className="flex flex-col items-center justify-center h-full opacity-70 mt-8 lg:mt-0">
                      <div className="w-24 h-24 rounded-full border-4 mb-4 shadow-lg flex items-center justify-center relative" style={{ borderColor: activePlayer.color }}>
                         <img src={CHARACTERS.find(c => c.id === activePlayer.character)?.url} className="w-full h-full rounded-full" />
                      </div>
                      <h3 className="text-2xl font-bold mb-2 text-center text-white">Turno di {activePlayer.nickname}</h3>
                      {phase === 'playing' ? (
                          <p className="text-slate-400 text-center text-lg animate-pulse">In attesa del lancio...</p>
                      ) : phase === 'rolling' ? (
                          <p className="text-rose-400 text-center font-bold text-lg animate-pulse">Lancio in corso!</p>
                      ) : (
                          <p className="text-red-500 text-center font-black text-xl">BOOM!</p>
                      )}
                   </div>
                )}
             </div>

             {/* LA BOMBA */}
             <div className="lg:w-2/3 flex flex-col items-center justify-center p-4 relative min-h-[400px]">
                
                {phase === 'exploded' && (
                    <div className="absolute inset-0 bg-red-900/40 z-30 flex items-center justify-center pointer-events-none">
                        <i className="fa-solid fa-burst text-[250px] text-yellow-500 animate-ping drop-shadow-[0_0_50px_rgba(250,204,21,1)]"></i>
                    </div>
                )}

                <div className="relative">
                    {/* Fuscia e Scintille */}
                    <div className="absolute -top-8 left-1/2 -translate-x-1/2 w-4 h-12 bg-slate-600 rounded-t-lg z-0"></div>
                    <div className="absolute -top-12 left-1/2 -translate-x-1/2 z-10">
                        {counter > 0 && phase !== 'exploded' && (
                            <i className="fa-solid fa-fire text-amber-500 text-3xl animate-pulse drop-shadow-[0_0_10px_rgba(245,158,11,0.8)]"></i>
                        )}
                    </div>

                    {/* Corpo Bomba */}
                    <div className={`w-48 h-48 md:w-64 md:h-64 rounded-full border-8 relative z-10 flex flex-col items-center justify-center shadow-[inset_0_0_50px_rgba(0,0,0,0.8),0_20px_50px_rgba(0,0,0,0.5)] transition-colors duration-500
                        ${phase === 'exploded' ? 'bg-red-600 border-red-800' : 
                          counter >= 18 ? 'bg-slate-800 border-red-500 animate-[pulse_0.5s_infinite]' : 
                          counter >= 15 ? 'bg-slate-800 border-rose-500 animate-[pulse_1s_infinite]' : 
                          'bg-slate-800 border-slate-600'}`}>
                        
                        <div className="text-slate-400 font-bold uppercase tracking-widest mb-1 text-sm md:text-base">Limite 21</div>
                        
                        <div className={`text-6xl md:text-8xl font-black drop-shadow-lg transition-colors duration-300
                            ${phase === 'exploded' ? 'text-black' : counter >= 18 ? 'text-red-500' : counter >= 15 ? 'text-rose-400' : 'text-white'}`}>
                            {counter}
                        </div>

                        {/* Animazione Dado Centrale */}
                        {phase === 'rolling' && (
                            <div className="absolute inset-0 bg-black/80 rounded-full flex items-center justify-center z-20 backdrop-blur-sm">
                                <div className="bg-white text-black w-24 h-24 rounded-2xl flex items-center justify-center text-6xl font-black border-4 border-slate-400 animate-bounce shadow-[0_0_20px_rgba(255,255,255,0.5)]">
                                    {displayRoll}
                                </div>
                            </div>
                        )}
                    </div>
                </div>

                {/* Info Bomba */}
                <div className="mt-8 bg-slate-900/80 px-6 py-3 rounded-full border border-slate-700 shadow-inner flex gap-6 text-sm font-bold text-slate-400 z-10">
                    <span className={counter >= 15 ? 'text-rose-400' : ''}>Distanza limite: {Math.max(0, 21 - counter)}</span>
                    <span className="w-px bg-slate-700"></span>
                    <span>Prossimo: {turnOrder[getNextIdx(gameState.activePlayerIndex, direction, deadPlayers)] ? players[turnOrder[getNextIdx(gameState.activePlayerIndex, direction, deadPlayers)]]?.nickname : '-'}</span>
                </div>
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: CHIAPPE AVIDE
    // ==========================================
    function ChiappeAvideGame({ user, originalUser, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const actualUser = isLocal ? originalUser : user;
      const isHost = isLocal || roomData.hostId === actualUser.uid;
      
      const { phase, roundCount, minigameScores, selections, paths, roundResults, turnOrder } = gameState;
      const activePlayerId = isLocal ? turnOrder[gameState.activePlayerIndex] : actualUser.uid;
      const isMyTurn = isLocal ? true : actualUser.uid === activePlayerId;
      
      const isGameOver = gameState.isGameOver;

      const [localSelection, setLocalSelection] = useState(null);
      const [timeLeft, setTimeLeft] = useState(10);
      const [animStep, setAnimStep] = useState(0);

      const cols = paths.length;
      const rows = 6;
      
      // Assegna una colonna di partenza fissa in basso per ogni giocatore
      const startCols = useMemo(() => {
          const sc = {};
          turnOrder.forEach((uid, i) => {
              sc[uid] = i % cols;
          });
          return sc;
      }, [turnOrder, cols]);

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'select') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'crash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {}
      };

      // Timer per l'animazione di movimento e scontro sulla griglia
      useEffect(() => {
        if (phase === 'revealing' && roundResults) {
            setAnimStep(0);
            const t1 = setTimeout(() => setAnimStep(1), 100); // Inizia a muoversi verso la colonna
            const t2 = setTimeout(() => {
                setAnimStep(2); // Arrivati a destinazione
                let crashed = false;
                let won = false;
                Object.values(roundResults).forEach(res => {
                    if (res.status === 'crashed') crashed = true;
                    if (res.status === 'won') won = true;
                });
                if (crashed) playSound('crash');
                if (won) setTimeout(() => playSound('coin'), crashed ? 400 : 0);
            }, 1100); // 1 secondo di transizione visiva
            return () => { clearTimeout(t1); clearTimeout(t2); }
        } else {
            setAnimStep(0);
        }
      }, [phase, roundResults]);

      useEffect(() => {
        if (phase !== 'programming' || !gameState.timerEnd) { setTimeLeft(10); return; }
        const updateT = () => setTimeLeft(Math.max(0, Math.ceil((gameState.timerEnd - Date.now())/1000)));
        updateT();
        const int = setInterval(updateT, 200);
        return () => clearInterval(int);
      }, [phase, gameState.timerEnd]);

      // Failsafe Fine Partita Minigioco
      useEffect(() => {
        if (gameState.isGameOver && roomData.status === 'playing' && isHost) {
          const timeout = setTimeout(() => {
            const results = gameState.finishedPlayers.map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3000);
          return () => clearTimeout(timeout);
        }
      }, [gameState.isGameOver, roomData.status, isHost, updateRoom, players, gameState.finishedPlayers]);

      // Host Orchestration: Fine Timer -> Risoluzione
      useEffect(() => {
        if (!isHost || phase !== 'programming' || isGameOver) return;
        
        const resolveRound = () => {
            const pathCounts = {};
            const nextScores = { ...minigameScores };
            const results = {};
            const finalSelections = { ...selections };

            // Gestione automatica di chi non ha scelto in tempo per le partite online
            // Facendolo qui, evitiamo di scatenare doppi salvataggi e race conditions
            turnOrder.forEach(uid => {
                if (finalSelections[uid] === undefined) {
                    finalSelections[uid] = -1;
                }
            });

            turnOrder.forEach(uid => {
                const sel = finalSelections[uid];
                if (sel !== undefined && sel !== -1) {
                    pathCounts[sel] = (pathCounts[sel] || 0) + 1;
                } else {
                    results[uid] = { status: 'missed', pts: 0 };
                }
            });

            turnOrder.forEach(uid => {
                const sel = finalSelections[uid];
                if (sel !== undefined && sel !== -1) {
                    if (pathCounts[sel] === 1) {
                        const pts = paths[sel];
                        nextScores[uid] += pts;
                        results[uid] = { status: 'won', pts, path: sel };
                    } else {
                        results[uid] = { status: 'crashed', pts: 0, path: sel };
                    }
                }
            });

            updateRoom({
                'gameState.phase': 'revealing',
                'gameState.minigameScores': nextScores,
                'gameState.roundResults': results,
                'gameState.selections': finalSelections
            });
        };

        const checkTimer = setInterval(() => {
            const allReady = turnOrder.every(uid => selections[uid] !== undefined);
            
            if (isLocal) {
                const activeUid = turnOrder[gameState.activePlayerIndex];
                if (allReady && turnOrder.length > 0) {
                    clearInterval(checkTimer);
                    resolveRound();
                } else if (Date.now() >= gameState.timerEnd && !selections[activeUid]) {
                    let nextIdx = (gameState.activePlayerIndex + 1) % turnOrder.length;
                    updateRoom({
                        [`gameState.selections.${activeUid}`]: -1, // -1 = Scaduto
                        'gameState.activePlayerIndex': nextIdx,
                        'gameState.timerEnd': Date.now() + 10000
                    });
                }
            } else {
                if (Date.now() >= gameState.timerEnd || (allReady && turnOrder.length > 0)) {
                    clearInterval(checkTimer);
                    resolveRound();
                }
            }
        }, 500);

        return () => clearInterval(checkTimer);
      }, [isHost, phase, isGameOver, isLocal, selections, turnOrder, gameState.timerEnd, paths, minigameScores]);

      // Host Orchestration: Prossimo Round
      useEffect(() => {
          if (!isHost || phase !== 'revealing' || isGameOver) return;
          const to = setTimeout(() => {
              if (roundCount >= 10) {
                  // Ordina i giocatori in base ai punti del minigioco alla fine
                  const sorted = [...turnOrder].sort((a,b) => minigameScores[b] - minigameScores[a]);
                  updateRoom({
                      'gameState.finishedPlayers': sorted,
                      'gameState.isGameOver': true
                  });
              } else {
                  const numPaths = Math.max(4, turnOrder.length);
                  const possiblePoints = [1, 3, 5, 10, 2, 7, 4, 8, 6, 9].sort(() => Math.random() - 0.5);
                  updateRoom({
                      'gameState.phase': 'programming',
                      'gameState.roundCount': roundCount + 1,
                      'gameState.selections': {},
                      'gameState.roundResults': null,
                      'gameState.paths': possiblePoints.slice(0, numPaths),
                      'gameState.timerEnd': Date.now() + 10000,
                      'gameState.activePlayerIndex': 0
                  });
              }
          }, 4500); // Rimaniamo nei risultati per 4.5s
          return () => clearTimeout(to);
      }, [isHost, phase, roundCount, isGameOver, turnOrder, minigameScores]);

      const selectPath = (idx) => {
          if (phase !== 'programming' || !isMyTurn || selections[activePlayerId] !== undefined) return;
          setLocalSelection(idx);
          playSound('select');
      };

      const confirmSelection = () => {
          if (localSelection === null) return;
          let updates = { [`gameState.selections.${activePlayerId}`]: localSelection };
          if (isLocal) {
              let nextIdx = (gameState.activePlayerIndex + 1) % turnOrder.length;
              updates['gameState.activePlayerIndex'] = nextIdx;
              updates['gameState.timerEnd'] = Date.now() + 10000;
          }
          updateRoom(updates);
          setLocalSelection(null);
      };

      const myStatus = selections[activePlayerId] !== undefined ? 'ready' : 'programming';

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          <style>{`
            @keyframes headbang {
                0% { transform: translate(1px, 1px) rotate(0deg); }
                10% { transform: translate(-1px, -2px) rotate(-5deg); }
                20% { transform: translate(-3px, 0px) rotate(5deg); }
                30% { transform: translate(3px, 2px) rotate(0deg); }
                40% { transform: translate(1px, -1px) rotate(5deg); }
                50% { transform: translate(-1px, 2px) rotate(-5deg); }
                60% { transform: translate(-3px, 1px) rotate(0deg); }
                70% { transform: translate(3px, 1px) rotate(-5deg); }
                80% { transform: translate(-1px, -1px) rotate(5deg); }
                90% { transform: translate(1px, 2px) rotate(0deg); }
                100% { transform: translate(1px, -2px) rotate(-5deg); }
            }
          `}</style>
          {/* HEADER CON I PUNTEGGI */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div>
               <h2 className="text-xl font-bold text-amber-500"><i className="fa-solid fa-sack-dollar mr-2"></i>Chiappe Avide</h2>
               <p className="text-xs text-slate-400">Round {roundCount} di 10</p>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {turnOrder.map(uid => {
                   const score = minigameScores[uid] || 0;
                   const isReady = selections[uid] !== undefined;
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative transition-all ${isReady ? 'border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'border-slate-700'}`} style={!isReady ? {borderColor: players[uid].color} : {}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 md:w-8 md:h-8 rounded-full" />
                          <div className="flex flex-col">
                             <span className="text-[10px] font-bold text-white">{players[uid].nickname}</span>
                             <span className="text-xs text-amber-400 font-black">{score} pt</span>
                          </div>
                          {isReady && phase === 'programming' && <i className="fa-solid fa-check absolute -top-2 -right-2 text-white bg-emerald-500 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          {/* MAIN AREA */}
          <div className="flex flex-col lg:flex-row gap-6 flex-1">
             
             {/* CONSOLE */}
             <div className="lg:w-1/3 bg-slate-800 p-4 md:p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between min-h-[250px]">
                 {myStatus === 'ready' && phase === 'programming' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <div className="w-24 h-24 bg-emerald-500/20 border-4 border-emerald-500 rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                            <i className="fa-solid fa-check text-5xl text-emerald-400"></i>
                         </div>
                         <h3 className="text-2xl font-black text-emerald-400">PERCORSO SCELTO</h3>
                         <p className="text-slate-400 mt-2 animate-pulse">In attesa degli altri...</p>
                     </div>
                 ) : phase === 'revealing' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <i className="fa-solid fa-eye text-6xl text-indigo-400 mb-4 animate-pulse"></i>
                         <h3 className="text-2xl font-black text-indigo-400 uppercase tracking-widest">Risultati!</h3>
                         <p className="text-slate-400 mt-2">Guarda la griglia: chi prenderà il bottino?</p>
                     </div>
                 ) : (
                     <div className="flex flex-col h-full w-full">
                         <h3 className="text-xl font-bold text-center text-white mb-2">
                             {isLocal ? `Turno di ${players[activePlayerId]?.nickname}` : "Scegli la Colonna"}
                         </h3>
                         <div className={`text-center font-mono font-black text-4xl mb-4 ${timeLeft <= 3 ? 'text-red-500 animate-pulse' : 'text-amber-400'}`}>
                             00:{timeLeft.toString().padStart(2, '0')}
                         </div>
                         
                         <p className="text-sm text-slate-400 text-center mb-6">
                             Scegli su quale colonna muoverti per arraffare i punti in cima. Se vi scontrate prenderete <strong className="text-red-400">0 punti</strong>!
                         </p>

                         <div className="mt-auto">
                             <button onClick={confirmSelection} disabled={localSelection === null} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white shadow-lg py-4 rounded-xl font-black text-xl transition-colors border-b-4 border-emerald-800 disabled:border-slate-800 active:border-b-0 active:translate-y-1">
                                <i className="fa-solid fa-check-double mr-2"></i> CONFERMA PERCORSO
                             </button>
                         </div>
                     </div>
                 )}
             </div>

             {/* GRIGLIA DELL'ARENA */}
             <div className="lg:w-2/3 bg-slate-900 p-2 md:p-6 rounded-xl border-4 flex items-center justify-center shadow-2xl relative overflow-hidden" style={{ borderColor: myStatus !== 'ready' && phase === 'programming' ? players[activePlayerId]?.color : '#334155' }}>
                
                {/* Background Decorativo Grid */}
                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'linear-gradient(#f59e0b 1px, transparent 1px), linear-gradient(90deg, #f59e0b 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                <div className="grid gap-px md:gap-1 w-full max-w-[500px] aspect-[4/5] relative z-10 bg-slate-800 p-1 border-2 border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.8)]"
                     style={{ gridTemplateColumns: `repeat(${cols}, 1fr)`, gridTemplateRows: `repeat(${rows}, 1fr)` }}>
                    
                    {Array.from({ length: rows * cols }).map((_, i) => {
                        const r = Math.floor(i / cols);
                        const c = i % cols;
                        const isPrize = r === 0;
                        const isStart = r === rows - 1;
                        const pts = paths[c];
                        const isSelectedLocal = localSelection === c;
                        
                        let cellClass = "w-full h-full rounded-sm transition-all duration-300 relative flex items-center justify-center ";
                        
                        if (phase === 'programming' && myStatus === 'programming') {
                            cellClass += "cursor-pointer hover:bg-slate-700 ";
                            if (isSelectedLocal) cellClass += "bg-emerald-900/30 ring-2 ring-emerald-500 ";
                            else cellClass += "bg-slate-900 ";
                        } else {
                            if (isSelectedLocal) cellClass += "bg-emerald-900/30 ";
                            else cellClass += "bg-slate-900 ";
                        }

                        if (isPrize) cellClass += "border-b-4 border-slate-800 ";

                        return (
                            <div key={`cell-${i}`} onClick={() => selectPath(c)} className={cellClass}>
                                {isPrize && (
                                    <span className={`font-black text-2xl md:text-4xl drop-shadow-md ${pts >= 10 ? 'text-yellow-400' : pts >= 5 ? 'text-amber-400' : 'text-slate-300'}`}>
                                        +{pts}
                                    </span>
                                )}
                                {isPrize && phase === 'programming' && isSelectedLocal && (
                                    <i className="fa-solid fa-crosshairs absolute text-emerald-400 text-4xl opacity-50 animate-pulse z-0"></i>
                                )}
                                {isStart && (
                                    <span className="text-slate-500 text-[10px] md:text-xs font-bold uppercase tracking-widest absolute bottom-1 opacity-30">START</span>
                                )}
                            </div>
                        )
                    })}

                    {/* Background Lines for Lanes */}
                    <svg className="absolute inset-0 w-full h-full pointer-events-none z-0 opacity-20">
                        {Array.from({length: cols}).map((_, c) => (
                            <line key={`lane-${c}`} x1={`${(c + 0.5) * (100/cols)}%`} y1="0%" x2={`${(c + 0.5) * (100/cols)}%`} y2="100%" stroke="white" strokeWidth="2" strokeDasharray="4 4" />
                        ))}
                    </svg>

                    {/* Rendering Giocatori */}
                    {turnOrder.map(uid => {
                        const sel = selections[uid];
                        const hasSelection = sel !== undefined && sel !== -1;
                        const targetCol = hasSelection ? sel : startCols[uid]; 
                        
                        let currR = rows - 1;
                        let currC = startCols[uid];

                        if (phase === 'revealing' && animStep >= 1 && hasSelection) {
                            currR = 0;
                            currC = targetCol;
                        }

                        const isCrash = animStep === 2 && roundResults?.[uid]?.status === 'crashed';
                        const isWin = animStep === 2 && roundResults?.[uid]?.status === 'won';
                        
                        // Piccolo offset per far vedere tutti durante lo scontro se sono nella stessa cella
                        let crashOffset = {};
                        if (isCrash) {
                            const pIdx = turnOrder.indexOf(uid);
                            crashOffset = {
                                transform: `translate(${(pIdx % 2 === 0 ? 1 : -1) * 8}px, ${(pIdx % 2 === 0 ? -4 : 4)}px)`
                            };
                        }

                        return (
                            <div key={`p-${uid}`} 
                                 className={`absolute flex items-center justify-center z-30 transition-all ${animStep === 1 ? 'duration-1000 ease-in-out' : 'duration-300'}`}
                                 style={{ 
                                     width: `${100/cols}%`, height: `${100/rows}%`, 
                                     left: `${currC * (100/cols)}%`, top: `${currR * (100/rows)}%` 
                                 }}>
                                 <div className={`relative flex items-center justify-center w-full h-full ${isCrash ? 'animate-[headbang_0.4s_infinite]' : isWin ? 'animate-bounce' : ''}`}>
                                     <img src={CHARACTERS.find(ch=>ch.id===players[uid].character)?.url} 
                                          className={`w-[60%] h-[60%] md:w-[70%] md:h-[70%] rounded-full border-2 shadow-[0_0_8px_rgba(0,0,0,0.8)]`} 
                                          style={{ borderColor: players[uid].color, backgroundColor: players[uid].color, ...crashOffset }} />
                                     
                                     {isCrash && (
                                         <div className="absolute inset-0 flex items-center justify-center z-40">
                                            <span className="absolute -top-4 font-black text-red-500 bg-black/60 px-1 rounded z-50 text-[10px] md:text-xs">CRASH!</span>
                                            <i className="fa-solid fa-burst text-yellow-400 text-3xl md:text-5xl animate-ping drop-shadow-[0_0_10px_rgba(250,204,21,1)]"></i>
                                         </div>
                                     )}
                                     {isWin && (
                                         <div className="absolute inset-0 flex items-center justify-center z-40">
                                            <span className="absolute -top-6 text-emerald-400 font-black text-xl md:text-3xl animate-[bounce_0.5s_infinite] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] z-50">+{roundResults[uid].pts}</span>
                                         </div>
                                     )}
                                 </div>
                            </div>
                        )
                    })}

                </div>
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: PASSA L'ASSO
    // ==========================================
    function PassaAssoGame({ user, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const isHost = isLocal || roomData.hostId === user.uid;
      const { phase, hands, revealed, lives, deadPlayers, turnOrder, deck, actionLog } = gameState;
      
      // Calcolo dell'ordine visivo per questo round (da sinistra verso destra)
      // Il primo giocatore a sinistra è chi inizia il round, seguito dagli altri.
      const visualTurnOrder = [];
      for (let i = 0; i < turnOrder.length; i++) {
          const idx = (gameState.roundStarterIndex + i) % turnOrder.length;
          visualTurnOrder.push(turnOrder[idx]);
      }

      const activePlayers = visualTurnOrder.filter(uid => !deadPlayers.includes(uid));
      const localActiveIdx = activePlayers.indexOf(turnOrder[gameState.activePlayerIndex]);
      const activePlayerId = activePlayers[localActiveIdx];
      const isMyTurn = isLocal ? true : user.uid === activePlayerId;

      const [peekingUid, setPeekingUid] = useState(null);
      const [peekTimeLeft, setPeekTimeLeft] = useState(5);

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'draw' || type === 'swap') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'error') { // Blocked by King
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'stand') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          }
        } catch (e) {}
      };

      // Fine Partita
      useEffect(() => {
        if (gameState.isGameOver && roomData.status === 'playing' && isHost) {
          const timeout = setTimeout(() => {
            const results = gameState.finishedPlayers.reverse().map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3500);
          return () => clearTimeout(timeout);
        }
      }, [gameState.isGameOver, roomData.status, isHost, updateRoom, players, gameState.finishedPlayers]);

      // Risoluzione Fine Round (Mostra le carte e assegna i danni)
      useEffect(() => {
          if (isHost && phase === 'revealing') {
              const to = setTimeout(() => {
                  let minVal = 99;
                  activePlayers.forEach(uid => {
                      if (hands[uid].value < minVal) minVal = hands[uid].value;
                  });
