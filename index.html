                  const losers = activePlayers.filter(uid => hands[uid].value === minVal);

                  let newLives = { ...lives };
                  let newDead = [...deadPlayers];
                  let newFinished = [...(gameState.finishedPlayers || [])];

                  losers.forEach(uid => {
                      newLives[uid] -= 1;
                      if (newLives[uid] <= 0 && !newDead.includes(uid)) {
                          newDead.push(uid);
                          newFinished.push(uid);
                      }
                  });

                  const remainingAlive = turnOrder.filter(uid => !newDead.includes(uid));
                  const isGameOver = remainingAlive.length <= 1;

                  if (isGameOver) {
                      if (remainingAlive.length === 1) newFinished.push(remainingAlive[0]);
                      updateRoom({
                          'gameState.phase': 'game_over',
                          'gameState.lives': newLives,
                          'gameState.deadPlayers': newDead,
                          'gameState.finishedPlayers': newFinished,
                          'gameState.isGameOver': true,
                          'gameState.losersThisRound': losers,
                          'gameState.actionLog': 'Il Gioco è Terminato!'
                      });
                  } else {
                      updateRoom({
                          'gameState.phase': 'round_results',
                          'gameState.lives': newLives,
                          'gameState.deadPlayers': newDead,
                          'gameState.losersThisRound': losers,
                          'gameState.actionLog': 'Valutazione delle vite...'
                      });
                  }
              }, 2500);
              return () => clearTimeout(to);
          }
      }, [isHost, phase, activePlayers, hands, lives, deadPlayers, turnOrder, gameState.finishedPlayers, updateRoom]);

      // Inizio Nuovo Round
      useEffect(() => {
          if (isHost && phase === 'round_results') {
              const to = setTimeout(() => {
                  const buildDeck = () => {
                      const suits = ['Denari', 'Coppe', 'Spade', 'Bastoni'];
                      const d = [];
                      suits.forEach(s => {
                          for(let v=1; v<=10; v++) d.push({value: v, suit: s, id: Math.random().toString(36).substring(2,9)});
                      });
                      return d.sort(() => Math.random() - 0.5);
                  };
                  let newDeck = buildDeck();
                  let newHands = {};
                  let newRevealed = {};
                  
                  // Il turno passa al prossimo giocatore vivo dopo chi ha iniziato il round precedente
                  let startIdx = (gameState.roundStarterIndex + 1) % turnOrder.length;
                  while(deadPlayers.includes(turnOrder[startIdx])) {
                      startIdx = (startIdx + 1) % turnOrder.length;
                  }

                  // Distribuzione
                  activePlayers.forEach(uid => {
                      const card = newDeck.pop();
                      newHands[uid] = card;
                      newRevealed[uid] = card.value >= 9;
                  });

                  updateRoom({
                      'gameState.phase': 'starting_peek',
                      'gameState.timerEnd': Date.now() + 5000,
                      'gameState.deck': newDeck,
                      'gameState.hands': newHands,
                      'gameState.revealed': newRevealed,
                      'gameState.roundCount': gameState.roundCount + 1,
                      'gameState.activePlayerIndex': startIdx,
                      'gameState.roundStarterIndex': startIdx,
                      'gameState.actionLog': `Guarda la tua carta segreta! (5s)`,
                      'gameState.losersThisRound': []
                  });
              }, 4000);
              return () => clearTimeout(to);
          }
      }, [isHost, phase, activePlayers, turnOrder, deadPlayers, gameState.roundStarterIndex, gameState.roundCount, updateRoom, players]);

      // Timer Sbirciare Host
      useEffect(() => {
          if (isHost && phase === 'starting_peek') {
              const checkTimeout = setInterval(() => {
                  if (Date.now() >= gameState.timerEnd) {
                      clearInterval(checkTimeout);
                      updateRoom({
                          'gameState.phase': 'playing',
                          'gameState.actionLog': `Il round inizia! Tocca a ${players[turnOrder[gameState.activePlayerIndex]].nickname}.`
                      });
                  }
              }, 500);
              return () => clearInterval(checkTimeout);
          }
      }, [isHost, phase, gameState.timerEnd, gameState.activePlayerIndex, turnOrder, players, updateRoom]);

      // Timer Sbirciare Locale
      useEffect(() => {
          if (phase === 'starting_peek' && gameState.timerEnd) {
              const interval = setInterval(() => {
                  setPeekTimeLeft(Math.max(0, Math.ceil((gameState.timerEnd - Date.now()) / 1000)));
              }, 200);
              return () => clearInterval(interval);
          }
      }, [phase, gameState.timerEnd]);

      const handleStand = () => {
          if (!isMyTurn || phase !== 'playing') return;
          playSound('stand');
          
          let logMsg = `${players[activePlayerId].nickname} ha deciso di stare.`;
          
          const starterLocalIdx = activePlayers.indexOf(turnOrder[gameState.roundStarterIndex]);
          const nextLocalIdx = (localActiveIdx + 1) % activePlayers.length;
          const isLastPlayerOfRound = nextLocalIdx === starterLocalIdx;
          
          let updates = { 'gameState.actionLog': logMsg };

          if (isLastPlayerOfRound) {
              updates['gameState.phase'] = 'revealing';
              activePlayers.forEach(uid => updates[`gameState.revealed.${uid}`] = true);
          } else {
              updates['gameState.activePlayerIndex'] = turnOrder.indexOf(activePlayers[nextLocalIdx]);
          }
          updateRoom(updates);
      };

      const handleSwap = () => {
          if (!isMyTurn || phase !== 'playing') return;

          const starterLocalIdx = activePlayers.indexOf(turnOrder[gameState.roundStarterIndex]);
          const nextLocalIdx = (localActiveIdx + 1) % activePlayers.length;
          const isLastPlayerOfRound = nextLocalIdx === starterLocalIdx;

          let targetType = 'player';
          let targetUid = null;
          let blocked = false;

          if (isLastPlayerOfRound) {
              targetType = 'deck';
          } else {
              let checkIdx = nextLocalIdx;
              while (checkIdx !== starterLocalIdx) {
                  const tUid = activePlayers[checkIdx];
                  const tCard = hands[tUid];
                  if (tCard.value === 10) {
                      blocked = true;
                      targetUid = tUid;
                      break;
                  } else if (tCard.value === 9) {
                      checkIdx = (checkIdx + 1) % activePlayers.length; // Salta il 9 (Cavallo) e riavvolge
                  } else {
                      targetUid = tUid;
                      break;
                  }
              }
              if (checkIdx === starterLocalIdx && !blocked) {
                  targetType = 'deck'; // Tutti quelli dopo avevano un 9
              }
          }

          let newHands = { ...hands };
          let newRevealed = { ...revealed };
          let newDeck = [...deck];
          let logMsg = "";

          if (blocked) {
              logMsg = `${players[activePlayerId].nickname} prova a scambiare, ma è BLOCCATO dal Re di ${players[targetUid].nickname}!`;
              playSound('error');
          } else if (targetType === 'deck') {
              if (newDeck.length === 0) {
                  const suits = ['Denari', 'Coppe', 'Spade', 'Bastoni'];
                  suits.forEach(s => {
                      for(let v=1; v<=10; v++) newDeck.push({value: v, suit: s, id: Math.random().toString(36).substring(2,9)});
                  });
                  newDeck.sort(() => Math.random() - 0.5);
              }
              const drawnCard = newDeck.pop();
              newHands[activePlayerId] = drawnCard;
              newRevealed[activePlayerId] = drawnCard.value >= 9;
              logMsg = `${players[activePlayerId].nickname} scambia la carta con il MAZZO.`;
              playSound('draw');
          } else {
              const oldActive = newHands[activePlayerId];
              const oldTarget = newHands[targetUid];
              newHands[activePlayerId] = oldTarget;
              newHands[targetUid] = oldActive;
              newRevealed[activePlayerId] = newHands[activePlayerId].value >= 9;
              newRevealed[targetUid] = newHands[targetUid].value >= 9; // Rivela solo se il destinatario si becca un 9 o 10
              logMsg = `${players[activePlayerId].nickname} scambia la carta con ${players[targetUid].nickname}.`;
              playSound('swap');
          }

          let updates = {
              'gameState.hands': newHands,
              'gameState.revealed': newRevealed,
              'gameState.deck': newDeck,
              'gameState.actionLog': logMsg
          };

          if (isLastPlayerOfRound) {
              updates['gameState.phase'] = 'revealing';
              activePlayers.forEach(uid => updates[`gameState.revealed.${uid}`] = true); // Rivela tutte a fine round
          } else {
              updates['gameState.activePlayerIndex'] = turnOrder.indexOf(activePlayers[nextLocalIdx]);
          }
          updateRoom(updates);
      };

      const renderCard = (card, isRevealed, isPeeking) => {
          if (!isRevealed && !isPeeking) {
              return (
                  <div className="w-16 h-24 md:w-20 md:h-28 bg-indigo-900 rounded-lg shadow-md border-2 border-slate-400 flex flex-col items-center justify-center relative overflow-hidden transition-transform hover:scale-105">
                      <div className="w-[85%] h-[90%] border border-indigo-700/50 rounded flex items-center justify-center bg-indigo-800" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.2) 5px, rgba(0,0,0,0.2) 10px)' }}>
                          <i className="fa-solid fa-gem text-indigo-400/30 text-2xl"></i>
                      </div>
                      <div className="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 bg-black/60 transition-opacity backdrop-blur-sm">
                          <i className="fa-solid fa-eye text-white text-xl"></i>
                      </div>
                  </div>
              );
          }

          let colorClass = 'text-slate-800';
          if (card.suit === 'Cuori' || card.suit === 'Quadri' || card.suit === 'Coppe' || card.suit === 'Denari') colorClass = 'text-red-600';
          let icon = 'fa-gem';
          if(card.suit === 'Coppe') icon = 'fa-wine-glass';
          if(card.suit === 'Spade') icon = 'fa-khanda';
          if(card.suit === 'Bastoni') icon = 'fa-gavel';

          let name = card.value;
          let specialIcon = icon;
          let cardBg = 'bg-slate-100';
          let cardBorder = 'border-slate-300';
          let specialStyle = {};

          if (card.value === 1) { 
              name = 'A'; 
              specialIcon = 'fa-star';
          }
          if (card.value === 8) { 
              name = 'D'; 
              specialIcon = 'fa-chess-queen';
              cardBg = 'bg-pink-50';
              cardBorder = 'border-pink-400';
          }
          if (card.value === 9) { 
              name = 'C'; 
              specialIcon = 'fa-chess-knight';
              cardBg = 'bg-amber-50';
              cardBorder = 'border-amber-500';
          }
          if (card.value === 10) { 
              name = 'R'; 
              specialIcon = 'fa-chess-king';
              cardBg = 'bg-yellow-100';
              cardBorder = 'border-yellow-500 ring-2 ring-yellow-400';
              specialStyle = { boxShadow: '0 0 15px rgba(234, 179, 8, 0.4)' };
          }

          return (
              <div className={`w-16 h-24 md:w-20 md:h-28 ${cardBg} rounded-lg shadow-md border-2 flex flex-col justify-between p-1.5 relative transition-all ${isPeeking ? `ring-4 ring-amber-400 scale-110 border-amber-400 z-20` : cardBorder}`} style={specialStyle}>
                  <div className={`text-[10px] md:text-xs font-black leading-none ${colorClass}`}>{name}</div>
                  <div className={`self-center text-2xl md:text-3xl ${colorClass} drop-shadow-sm flex flex-col items-center`}>
                      <i className={`fa-solid ${specialIcon}`}></i>
                      {card.value >= 8 && <i className={`fa-solid ${icon} text-[10px] mt-1 opacity-50`}></i>}
                  </div>
                  <div className={`text-[10px] md:text-xs font-black leading-none text-right rotate-180 ${colorClass}`}>{name}</div>
                  {isPeeking && <div className="absolute inset-0 bg-amber-400/10 rounded-lg pointer-events-none"></div>}
              </div>
          );
      };

      const myCard = hands[activePlayerId];
      const canSwap = myCard && myCard.value < 9; // Disabilita il pulsante scambia se si ha 9 o 10

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div>
               <h2 className="text-xl font-bold text-indigo-400"><i className="fa-solid fa-people-arrows mr-2"></i>Passa l'Asso</h2>
               <p className="text-xs text-slate-400">Round {gameState.roundCount}</p>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {visualTurnOrder.map((uid) => {
                   const isDead = deadPlayers.includes(uid);
                   const isActive = uid === activePlayerId && phase === 'playing';
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative transition-all ${isDead ? 'opacity-40 grayscale scale-95' : isActive ? 'scale-105 border-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.3)]' : 'opacity-80'}`} style={{borderColor: isDead ? '#334155' : players[uid].color}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                          <div className="flex flex-col">
                              <span className={`text-[10px] font-bold ${isDead ? 'line-through text-slate-500' : 'text-white'}`}>{players[uid].nickname}</span>
                              <div className="flex gap-0.5">
                                 {[1,2,3,4].map(l => (
                                     <i key={l} className={`fa-solid fa-heart text-[8px] ${l <= lives[uid] ? 'text-red-500' : 'text-slate-700'}`}></i>
                                 ))}
                              </div>
                          </div>
                          {isDead && <i className="fa-solid fa-skull absolute -top-2 -right-2 text-white bg-slate-700 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          {/* MAIN AREA */}
          <div className="flex-1 bg-slate-900 rounded-2xl border-4 border-slate-700 shadow-inner flex flex-col relative overflow-hidden">
             
             {/* OVERLAY RISULTATI ROUND */}
             {(phase === 'round_results' || phase === 'game_over') && (
                 <div className="absolute inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm animate-[spinCard_0.3s_ease-out]">
                     <h2 className="text-4xl font-black text-red-500 mb-6 uppercase tracking-widest drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">FINE ROUND!</h2>
                     <p className="text-white text-xl mb-6 font-bold">I giocatori che perdono una vita sono:</p>
                     <div className="flex justify-center gap-4 flex-wrap max-w-2xl">
                         {gameState.losersThisRound.map(uid => (
                             <div key={uid} className="bg-red-900/40 border border-red-500 p-4 rounded-xl flex flex-col items-center shadow-lg transform hover:scale-105 transition-transform">
                                 <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-16 h-16 rounded-full border-2 border-red-500 mb-2" />
                                 <span className="font-bold text-white mb-2">{players[uid].nickname}</span>
                                 <div className="flex gap-1">
                                     {[1,2,3,4].map(l => {
                                         const isLostNow = l === lives[uid] + 1;
                                         return <i key={l} className={`fa-solid fa-heart ${l <= lives[uid] ? 'text-red-500' : isLostNow ? 'text-slate-700 animate-ping' : 'text-slate-700'}`}></i>
                                     })}
                                 </div>
                             </div>
                         ))}
                     </div>
                 </div>
             )}

             <div className="p-4 bg-indigo-900/40 text-center font-bold text-indigo-200 border-b border-indigo-500/30 min-h-[50px] flex items-center justify-center">
                 {actionLog}
             </div>

             {/* PLAYERS & CARDS */}
             <div className="flex-1 flex items-center justify-start md:justify-center p-4 overflow-x-auto scrollbar-thin scrollbar-thumb-slate-700">
                 <div className="flex gap-4 items-center">
                     {activePlayers.map((uid) => {
                         const isTurn = activePlayerId === uid && phase === 'playing';
                         const pCard = hands[uid];
                         const isRevealed = revealed[uid] || peekingUid === uid || phase === 'revealing' || phase === 'round_results' || phase === 'game_over';

                         return (
                             <div key={uid} className={`flex flex-col items-center flex-shrink-0 transition-all duration-300 ${isTurn ? 'scale-110 drop-shadow-xl z-20' : 'opacity-80 scale-95 z-10'}`}>
                                 <div className="flex items-center gap-2 mb-3 bg-slate-800/80 px-3 py-1.5 rounded-full border" style={{borderColor: players[uid].color}}>
                                     <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                                     <span className="text-xs font-bold text-white">{players[uid].nickname}</span>
                                 </div>
                                 
                                 <div className="cursor-pointer"
                                      onPointerDown={(e) => { e.preventDefault(); if ((isLocal || user.uid === uid) && !revealed[uid]) setPeekingUid(uid); }}
                                      onPointerUp={() => setPeekingUid(null)}
                                      onPointerLeave={() => setPeekingUid(null)}
                                      onContextMenu={(e) => e.preventDefault()}>
                                     {renderCard(pCard, isRevealed, peekingUid === uid)}
                                 </div>
                                 
                                 {((isTurn && phase === 'playing') || (phase === 'starting_peek' && (isLocal || user.uid === uid))) && !revealed[uid] && (
                                     <span className="text-[10px] text-slate-400 mt-2 bg-slate-800 px-2 py-0.5 rounded-full animate-pulse border border-slate-600"><i className="fa-solid fa-hand-pointer mr-1"></i>Tieni premuto</span>
                                 )}
                             </div>
                         )
                     })}
                     
                     {/* DECK SLOT */}
                     <div className="flex flex-col items-center flex-shrink-0 opacity-80 ml-4 pl-4 border-l-2 border-slate-700 border-dashed">
                         <div className="mb-3 px-3 py-1.5 opacity-0"><span className="text-xs">Spazio</span></div>
                         <div className="w-16 h-24 md:w-20 md:h-28 bg-slate-800 border-4 border-slate-600 border-dashed rounded-lg flex items-center justify-center relative shadow-inner">
                             <div className="absolute inset-2 border-2 border-slate-700/50 rounded flex items-center justify-center">
                                <i className="fa-solid fa-layer-group text-slate-500 text-3xl"></i>
                             </div>
                             <span className="absolute bottom-2 text-[10px] font-black text-slate-500">MAZZO ({deck.length})</span>
                         </div>
                     </div>
                 </div>
             </div>

             {/* CONTROLS */}
             <div className="p-4 bg-slate-800 border-t border-slate-700 flex justify-center gap-4 min-h-[100px] items-center">
                 {phase === 'starting_peek' ? (
                     <div className="animate-pulse text-xl md:text-2xl text-amber-400 font-black tracking-widest bg-slate-900/80 px-8 py-4 rounded-xl border-2 border-amber-500/50 flex items-center gap-4 shadow-[0_0_15px_rgba(251,191,36,0.2)]">
                        <i className="fa-solid fa-eye text-3xl"></i> SBIRCIA: {peekTimeLeft}s
                     </div>
                 ) : isMyTurn && phase === 'playing' ? (
                     <>
                        <button onClick={handleStand} className="w-full md:w-auto min-w-[150px] bg-slate-600 hover:bg-slate-500 px-8 py-4 rounded-xl font-black text-xl text-white border-b-4 border-slate-800 active:border-b-0 active:translate-y-1 transition-all shadow-lg flex items-center justify-center gap-2">
                            STO <i className="fa-solid fa-hand text-slate-300"></i>
                        </button>
                        <button onClick={handleSwap} disabled={!canSwap} className="w-full md:w-auto min-w-[150px] bg-amber-600 hover:bg-amber-500 disabled:bg-slate-700 disabled:border-slate-800 disabled:text-slate-500 px-8 py-4 rounded-xl font-black text-xl text-white border-b-4 border-amber-800 active:border-b-0 active:translate-y-1 transition-all shadow-lg flex items-center justify-center gap-2" title={!canSwap ? "Non puoi scambiare un 9 o un 10!" : ""}>
                            SCAMBIA <i className="fa-solid fa-right-left text-amber-200"></i>
                        </button>
                     </>
                 ) : phase === 'playing' ? (
                     <div className="animate-pulse text-lg text-slate-400 font-bold bg-slate-900 px-8 py-3 rounded-xl border border-slate-700 flex items-center gap-3">
                        <img src={CHARACTERS.find(c=>c.id===players[activePlayerId]?.character)?.url} className="w-8 h-8 rounded-full border-2 grayscale" />
                        <span>{players[activePlayerId]?.nickname} sta decidendo...</span>
                     </div>
                 ) : (
                     <div className="text-lg text-slate-500 font-bold uppercase tracking-widest">
                        Risoluzione Round in corso
                     </div>
                 )}
             </div>
          </div>

          {/* LEGENDA CARTE */}
          <div className="bg-slate-800 p-3 md:p-4 rounded-xl border border-slate-700 shadow-md flex flex-col md:flex-row justify-center items-center gap-2 md:gap-4 text-xs md:text-sm text-slate-300 mt-2">
             <span className="font-bold text-indigo-400 uppercase tracking-widest text-[10px] md:text-xs"><i className="fa-solid fa-circle-info mr-1"></i> Carte Speciali:</span>
             <div className="flex flex-wrap justify-center items-center gap-2 md:gap-4">
                 <div className="flex items-center gap-1.5 bg-slate-900/50 px-2 py-1 rounded border border-slate-600">
                     <span className="text-white font-bold"><i className="fa-solid fa-star mr-1 text-slate-400"></i>Asso (A)</span>
                     <span className="text-slate-400">= 1</span>
                 </div>
                 <div className="flex items-center gap-1.5 bg-pink-900/20 px-2 py-1 rounded border border-pink-500/30">
                     <span className="text-pink-300 font-bold"><i className="fa-solid fa-chess-queen mr-1"></i>Donna (D)</span>
                     <span className="text-slate-400">= 8</span>
                 </div>
                 <div className="flex items-center gap-1.5 bg-amber-900/20 px-2 py-1 rounded border border-amber-500/30">
                     <span className="text-amber-300 font-bold"><i className="fa-solid fa-chess-knight mr-1"></i>Cavallo (C)</span>
                     <span className="text-slate-400">= 9 <span className="text-[10px] text-amber-500/70 ml-1">(Salta)</span></span>
                 </div>
                 <div className="flex items-center gap-1.5 bg-yellow-900/20 px-2 py-1 rounded border border-yellow-500/30">
                     <span className="text-yellow-300 font-bold"><i className="fa-solid fa-chess-king mr-1"></i>Re (R)</span>
                     <span className="text-slate-400">= 10 <span className="text-[10px] text-yellow-500/70 ml-1">(Blocca)</span></span>
                 </div>
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: BOMBE A GO GO!
    // ==========================================
    function BombeAGoGoGame({ user, originalUser, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const actualUser = isLocal ? originalUser : user;
      const isHost = isLocal || roomData.hostId === actualUser.uid;
      
      const { phase, positions, lives, selections, bombs, hitsThisRound, deadPlayers, turnOrder } = gameState;
      const activePlayers = turnOrder.filter(uid => !deadPlayers.includes(uid));
      const isGameOver = activePlayers.length <= 1 && deadPlayers.length > 0;
      
      const activePlayerId = isLocal ? turnOrder[gameState.activePlayerIndex] : actualUser.uid;
      
      const [localSelection, setLocalSelection] = useState({ targetPos: null, bombPos: null });
      const [inputMode, setInputMode] = useState('move'); // 'move' o 'bomb'

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'explosion') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(10, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
          } else if (type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.setValueAtTime(100, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(50, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
          }
        } catch (e) {}
      };

      // Failsafe Fine Partita
      useEffect(() => {
        if (isGameOver && roomData.status === 'playing' && isHost) {
          const to = setTimeout(() => {
            let finalFinished = [...gameState.finishedPlayers];
            if (activePlayers.length === 1) {
                finalFinished.push(activePlayers[0]); 
            }
            const results = finalFinished.reverse().map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3000);
          return () => clearTimeout(to);
        }
      }, [isGameOver, roomData.status, isHost]);

      // MACCHINA A STATI DELL'HOST
      useEffect(() => {
        if (!isHost || phase !== 'programming' || isGameOver) return;
        
        const resolveRound = () => {
            let newPos = { ...positions };
            let newBombs = [];
            let newDestroyed = [...(gameState.destroyedTiles || [])];
            
            activePlayers.forEach(uid => {
                const sel = selections[uid];
                if (sel) {
                    if (sel.targetPos) newPos[uid] = sel.targetPos;
                    if (sel.bombPos) {
                        newBombs.push({ ...sel.bombPos, owner: uid });
                        if (!newDestroyed.some(t => t.r === sel.bombPos.r && t.c === sel.bombPos.c)) {
                            newDestroyed.push({ r: sel.bombPos.r, c: sel.bombPos.c });
                        }
                    }
                }
            });
            
            let damage = {};
            
            // 1. Danno dell'esplosione
            newBombs.forEach(bomb => {
                activePlayers.forEach(uid => {
                    if (newPos[uid].r === bomb.r && newPos[uid].c === bomb.c) {
                        damage[uid] = (damage[uid] || 0) + 1;
                    }
                });
            });

            // 2. Danno fatale da caduta (Se il giocatore si trova in una cella che era GIA' distrutta prima)
            activePlayers.forEach(uid => {
                const pos = newPos[uid];
                if ((gameState.destroyedTiles || []).some(t => t.r === pos.r && t.c === pos.c)) {
                    damage[uid] = (damage[uid] || 0) + 99; // Cade e muore sul colpo
                }
            });

            let newLives = { ...lives };
            let newDead = [...deadPlayers];
            let newFinished = [...gameState.finishedPlayers];

            Object.entries(damage).forEach(([uid, dmg]) => {
                newLives[uid] -= dmg;
                if (newLives[uid] <= 0 && !newDead.includes(uid)) {
                    newDead.push(uid);
                    newFinished.push(uid); 
                }
            });

            if (Object.keys(damage).length > 0) setTimeout(() => playSound('hit'), 200);
            else playSound('explosion');

            updateRoom({
                'gameState.positions': newPos,
                'gameState.bombs': newBombs,
                'gameState.destroyedTiles': newDestroyed,
                'gameState.hitsThisRound': damage,
                'gameState.lives': newLives,
                'gameState.deadPlayers': newDead,
                'gameState.finishedPlayers': newFinished,
                'gameState.phase': 'explosion'
            });
        };

        const checkTimer = setInterval(() => {
            const allReady = activePlayers.every(uid => selections[uid] !== undefined);
            
            if (isLocal) {
                const activeUid = turnOrder[gameState.activePlayerIndex];
                if (allReady && activePlayers.length > 0) {
                    clearInterval(checkTimer);
                    resolveRound();
                } else if (Date.now() >= gameState.timerEnd && !selections[activeUid]) {
                    // Tempo scaduto per il giocatore corrente
                    let nextIdx = (gameState.activePlayerIndex + 1) % turnOrder.length;
                    let loop = 0;
                    while (deadPlayers.includes(turnOrder[nextIdx]) && loop < turnOrder.length) {
                        nextIdx = (nextIdx + 1) % turnOrder.length;
                        loop++;
                    }
                    updateRoom({
                        [`gameState.selections.${activeUid}`]: { targetPos: null, bombPos: null },
                        'gameState.activePlayerIndex': nextIdx,
                        'gameState.timerEnd': Date.now() + 20000
                    });
                }
            } else {
                if (Date.now() >= gameState.timerEnd || (allReady && activePlayers.length > 0)) {
                    clearInterval(checkTimer);
                    resolveRound();
                }
            }
        }, 500);

        return () => clearInterval(checkTimer);
      }, [isHost, phase, isGameOver, isLocal, selections, activePlayers, gameState.timerEnd, positions, lives, deadPlayers, gameState.finishedPlayers, gameState.roundCount]);

      useEffect(() => {
          if (!isHost || isGameOver) return;
          if (phase === 'explosion') {
              const to = setTimeout(() => {
                  updateRoom({ 'gameState.phase': 'cleanup' });
              }, 3000);
              return () => clearTimeout(to);
          } else if (phase === 'cleanup') {
              const to = setTimeout(() => {
                  let firstAliveIdx = 0;
                  for (let i = 0; i < turnOrder.length; i++) {
                      if (!deadPlayers.includes(turnOrder[i])) {
                          firstAliveIdx = i;
                          break;
                      }
                  }
                  updateRoom({
                      'gameState.phase': 'programming',
                      'gameState.selections': {},
                      'gameState.bombs': [],

                      'gameState.roundCount': (gameState.roundCount || 1) + 1,
                      'gameState.timerEnd': Date.now() + 20000,
                      'gameState.activePlayerIndex': firstAliveIdx
                  });
              }, 1500);
              return () => clearTimeout(to);
          }
      }, [isHost, phase, isGameOver]);

      // Timer UI
      const [timeLeft, setTimeLeft] = useState(20);
      useEffect(() => {
        if (phase !== 'programming' || !gameState.timerEnd) { setTimeLeft(20); return; }
        const updateT = () => setTimeLeft(Math.max(0, Math.ceil((gameState.timerEnd - Date.now())/1000)));
        updateT();
        const int = setInterval(updateT, 200);
        return () => clearInterval(int);
      }, [phase, gameState.timerEnd]);

      const handleCellClick = (r, c) => {
          if (phase !== 'programming' || deadPlayers.includes(activePlayerId)) return;
          if (!isLocal && actualUser.uid !== activePlayerId) return;
          if (selections[activePlayerId]) return; 
          
          if ((gameState.destroyedTiles || []).some(t => t.r === r && t.c === c)) return; // Impedisce di cliccare sul vuoto
          
          if (inputMode === 'move') {
              setLocalSelection(prev => ({ ...prev, targetPos: {r, c} }));
              setInputMode('bomb'); 
          } else {
              setLocalSelection(prev => ({ ...prev, bombPos: {r, c} }));
          }
      };

      const submitSelection = () => {
          if (!localSelection.targetPos || !localSelection.bombPos) return alert("Devi selezionare sia il movimento che la bomba!");
          
          let updates = { [`gameState.selections.${activePlayerId}`]: localSelection };
          
          if (isLocal) {
              let nextIdx = (gameState.activePlayerIndex + 1) % turnOrder.length;

              while (deadPlayers.includes(turnOrder[nextIdx]) && loop < turnOrder.length) {

                  loop++;
              }
              updates['gameState.activePlayerIndex'] = nextIdx;
              updates['gameState.timerEnd'] = Date.now() + 20000;
          }

          updateRoom(updates);
          setLocalSelection({ targetPos: null, bombPos: null });
          setInputMode('move');
      };

      const myStatus = deadPlayers.includes(activePlayerId) ? 'dead' : selections[activePlayerId] ? 'ready' : 'programming';

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div>
               <div className="flex items-center gap-2">
                   <h2 className="text-xl font-bold text-rose-500"><i className="fa-solid fa-bomb mr-2"></i>Bombe a Go Go!</h2>

                       Turno {gameState.roundCount || 1}
                   </span>
               </div>
               <p className="text-xs text-slate-400">
                   Piazza una bomba e spostati! Attento ai buchi nel terreno!
               </p>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {turnOrder.map(uid => {
                   const isDead = deadPlayers.includes(uid);
                   const isReady = selections[uid] !== undefined;
                   
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative transition-all ${isDead ? 'opacity-40 grayscale scale-95' : isReady ? 'border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'border-slate-700'}`} style={!isDead && !isReady ? {borderColor: players[uid].color} : {}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                          <div className="flex flex-col">
                             <span className={`text-[10px] font-bold ${isDead ? 'line-through' : ''}`}>{players[uid].nickname}</span>
                             <div className="flex gap-0.5">
                                 {[1,2].map(l => (
                                     <i key={l} className={`fa-solid fa-heart text-[8px] ${l <= lives[uid] ? 'text-rose-500' : 'text-slate-700'}`}></i>
                                 ))}

                       </div>
                   )
               })}
            </div>
          </div>

          <div className="flex flex-col lg:flex-row gap-6 flex-1">
             <div className="lg:w-1/3 bg-slate-800 p-4 md:p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between min-h-[300px]">
                 {myStatus === 'dead' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <i className="fa-solid fa-skull text-6xl text-slate-600 mb-4"></i>

                 ) : myStatus === 'ready' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <div className="w-24 h-24 bg-emerald-500/20 border-4 border-emerald-500 rounded-full flex items-center justify-center mb-4">

                         <h3 className="text-2xl font-black text-emerald-400">SCELTE CONFERMATE</h3>
                         <p className="text-slate-400 mt-2 animate-pulse">In attesa degli altri giocatori...</p>
                     </div>
                 ) : phase !== 'programming' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <i className="fa-solid fa-burst text-6xl text-rose-500 mb-4 animate-ping"></i>
                         <h3 className="text-2xl font-black text-rose-400 uppercase tracking-widest">BOOM!</h3>
                         <p className="text-slate-400 mt-2">Guarda l'arena per vedere chi è esploso.</p>
                     </div>
                 ) : (
                     <div className="flex flex-col h-full w-full">
                         <h3 className="text-xl font-bold text-center text-white mb-2">
                             {isLocal ? `Turno di ${players[activePlayerId]?.nickname}` : "Programma le Mosse"}
                         </h3>
                         <div className={`text-center font-mono font-black text-3xl mb-4 ${timeLeft <= 5 ? 'text-red-500 animate-pulse' : 'text-amber-400'}`}>
                             00:{timeLeft.toString().padStart(2, '0')}
                         </div>
                         
                         <div className="flex gap-2 w-full justify-center mb-6">
                             <button onClick={() => setInputMode('move')} className={`flex-1 py-3 rounded-xl font-bold flex flex-col items-center gap-1 transition-all ${inputMode === 'move' ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] scale-105' : 'bg-slate-700 text-slate-400 border border-slate-600'}`}>
                                 <i className="fa-solid fa-person-walking text-2xl"></i> Muoviti
                                 {localSelection.targetPos && <i className="fa-solid fa-check-circle text-xs text-emerald-300 absolute top-2 right-2"></i>}
                             </button>
                             <button onClick={() => setInputMode('bomb')} className={`flex-1 py-3 rounded-xl font-bold flex flex-col items-center gap-1 transition-all ${inputMode === 'bomb' ? 'bg-rose-600 text-white shadow-[0_0_15px_rgba(225,29,72,0.5)] scale-105' : 'bg-slate-700 text-slate-400 border border-slate-600'}`}>
                                 <i className="fa-solid fa-bomb text-2xl"></i> Bomba
                                 {localSelection.bombPos && <i className="fa-solid fa-check-circle text-xs text-rose-300 absolute top-2 right-2"></i>}
                             </button>
                         </div>

                         <div className="mt-auto">
                             <button onClick={submitSelection} disabled={!localSelection.targetPos || !localSelection.bombPos} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white shadow-lg py-4 rounded-xl font-black text-xl transition-colors border-b-4 border-emerald-800 disabled:border-slate-800 active:border-b-0 active:translate-y-1">
                                <i className="fa-solid fa-satellite-dish mr-2"></i> TRASMETTI
                             </button>
                         </div>
                     </div>
                 )}
             </div>

             <div className="lg:w-2/3 bg-slate-900 p-2 md:p-6 rounded-xl border-4 flex items-center justify-center shadow-2xl relative overflow-hidden" style={{ borderColor: myStatus === 'dead' ? '#475569' : players[activePlayerId]?.color || '#334155' }}>
                
                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'linear-gradient(#f43f5e 1px, transparent 1px), linear-gradient(90deg, #f43f5e 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                <div className="grid grid-cols-10 grid-rows-10 gap-px md:gap-1 w-full max-w-[500px] aspect-square relative z-10 bg-slate-800 p-1 border-2 border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.8)]">
                    
                    {Array.from({ length: 100 }).map((_, i) => {
                        const r = Math.floor(i / 10);
                        const c = i % 10;
                        const isDestroyed = (gameState.destroyedTiles || []).some(t => t.r === r && t.c === c);
                        const isSelectedMove = localSelection.targetPos?.r === r && localSelection.targetPos?.c === c;
                        const isSelectedBomb = localSelection.bombPos?.r === r && localSelection.bombPos?.c === c;
                        
                        let cellClass = "w-full h-full rounded-sm transition-all duration-500 ";
                        if (isDestroyed) {
                            cellClass += "opacity-0 pointer-events-none ";
                        } else {
                            cellClass += "bg-slate-900 ";
                            if (phase === 'programming' && myStatus === 'programming') {
                                cellClass += "cursor-pointer hover:bg-slate-700 ";
                                if (inputMode === 'move' && isSelectedMove) cellClass += "ring-2 ring-emerald-500 bg-emerald-900/30 ";
                                if (inputMode === 'bomb' && isSelectedBomb) cellClass += "ring-2 ring-rose-500 bg-rose-900/30 ";
                            }
                        }

                        return <div key={`cell-${i}`} onClick={() => handleCellClick(r, c)} className={cellClass}></div>
                    })}

                    {activePlayers.map(uid => {
                        const {r, c} = positions[uid];
                        const pColor = players[uid].color;
                        const isHit = hitsThisRound && hitsThisRound[uid] > 0;
                        
                        return (
                            <div key={`p-${uid}`} className="absolute transition-all duration-300 flex items-center justify-center z-30 pointer-events-none" style={{ width: '10%', height: '10%', left: `${c * 10}%`, top: `${r * 10}%` }}>
                                 <div className={`relative flex items-center justify-center w-full h-full ${isHit ? 'animate-bounce' : ''}`}>
                                     <img src={CHARACTERS.find(ch=>ch.id===players[uid].character)?.url} className={`w-[80%] h-[80%] rounded-full border-2 shadow-[0_0_8px_rgba(0,0,0,0.8)]`} style={{ borderColor: pColor, backgroundColor: pColor }} />
                                     
                                     {isHit && (
                                         <div className="absolute inset-0 flex items-center justify-center z-40">
                                            <span className="absolute -top-8 text-red-500 font-black text-3xl animate-[bounce_0.5s_infinite] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] z-50">-{hitsThisRound[uid]}</span>
                                            <i className="fa-solid fa-burst text-yellow-400 text-5xl animate-ping drop-shadow-[0_0_15px_rgba(250,204,21,1)]"></i>
                                         </div>
                                     )}
                                 </div>
                            </div>
                        )
                    })}

                    {phase === 'programming' && myStatus === 'programming' && localSelection.targetPos && (
                        <div className="absolute flex items-center justify-center z-20 pointer-events-none opacity-60" style={{ width: '10%', height: '10%', left: `${localSelection.targetPos.c * 10}%`, top: `${localSelection.targetPos.r * 10}%` }}>
                            <img src={CHARACTERS.find(ch=>ch.id===players[activePlayerId]?.character)?.url} className="w-[80%] h-[80%] rounded-full border-2 border-dashed grayscale" style={{ borderColor: players[activePlayerId]?.color }} />
                        </div>
                    )}

                    {phase === 'programming' && myStatus === 'programming' && localSelection.bombPos && (
                        <div className="absolute flex items-center justify-center z-20 pointer-events-none opacity-80" style={{ width: '10%', height: '10%', left: `${localSelection.bombPos.c * 10}%`, top: `${localSelection.bombPos.r * 10}%` }}>
                            <div className="w-[60%] h-[60%] bg-rose-600 rounded-full border-2 border-rose-900 flex items-center justify-center shadow-[0_0_10px_rgba(225,29,72,0.8)]">
                                <i className="fa-solid fa-bomb text-[12px] text-white"></i>
                            </div>
                        </div>
                    )}

                    {phase === 'explosion' && bombs.map((bomb, idx) => (
                        <div key={`bomb-${idx}`} className="absolute flex items-center justify-center z-40 pointer-events-none" style={{ width: '10%', height: '10%', left: `${bomb.c * 10}%`, top: `${bomb.r * 10}%` }}>
                            <div className="absolute inset-[-50%] bg-rose-500/50 rounded-full animate-ping"></div>
                            <i className="fa-solid fa-bomb text-4xl text-rose-500 animate-bounce drop-shadow-[0_0_20px_rgba(244,63,94,1)]"></i>
                        </div>
                    ))}
                </div>
             </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MINIGIOCO: 1... 2... 3... SPARA!
    // ==========================================
    function Spara123Game({ user, originalUser, roomData, roomId, updateRoom, isLocal }) {
      const { gameState, players } = roomData;
      const actualUser = isLocal ? originalUser : user;
      const isHost = isLocal || roomData.hostId === actualUser.uid;
      
      const { phase, positions, facing, lives, moves, laserBeams, deadPlayers, turnOrder } = gameState;
      
      const activePlayers = turnOrder.filter(uid => !deadPlayers.includes(uid));
      const isGameOver = activePlayers.length <= 1 && deadPlayers.length > 0;

      // Gestione input locale per l'utente
      const [localMoves, setLocalMoves] = useState([]); // Array di max 4 elementi (3 mov + 1 sparo)

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'step') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
          } else if (type === 'laser') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.setValueAtTime(100, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(50, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
          }
        } catch (e) {}
      };

      // Failsafe Fine Partita
      useEffect(() => {
        if (isGameOver && roomData.status === 'playing' && isHost) {
          const to = setTimeout(() => {
            let finalFinished = [...gameState.finishedPlayers];
            if (activePlayers.length === 1) {
                finalFinished.push(activePlayers[0]); // Il vincitore si aggiunge alla fine (quindi prende la 1° pos invertendo)
            }
            // I morti sono già in finishedPlayers nel momento in cui muoiono
            const results = finalFinished.reverse().map((id, index) => ({ id, position: index + 1 }));
            const pointsUpdate = {};
            results.forEach((res, index) => {
              const pts = POINTS_SYSTEM[index] || 0; res.pointsEarned = pts;
              pointsUpdate[`players.${res.id}.totalScore`] = players[res.id].totalScore + pts;
            });
            updateRoom({ status: 'round_results', 'gameState.results': results, ...pointsUpdate });
          }, 3000);
          return () => clearTimeout(to);
        }
      }, [isGameOver, roomData.status, isHost]);

      // MACCHINA A STATI DELL'HOST (Simulazione Simulata)
      useEffect(() => {
          if (!isHost || isGameOver) return;

          if (phase === 'programming') {
              const allReady = activePlayers.every(uid => moves[uid] && moves[uid].length === 4);
              if (allReady && activePlayers.length > 0) {
                  updateRoom({ 'gameState.phase': 'sim_0' });
              }
          } 
          else if (phase.startsWith('sim_') && phase !== 'sim_turn' && phase !== 'sim_laser') {
              // Gestione Movimenti (sim_0, sim_1, sim_2)
              const stepIdx = parseInt(phase.split('_')[1]);
              const minB = gameState.roundCount >= 12 ? 2 : (gameState.roundCount >= 4 ? 1 : 0);
              const maxB = gameState.roundCount >= 12 ? 7 : (gameState.roundCount >= 4 ? 8 : 9);

              const to = setTimeout(() => {
                  playSound('step');
                  let newPos = { ...positions };
                  let newMines = [...(gameState.mines || [])];
                  let newMineHits = { ...(gameState.mineHits || {}) };
                  
                  activePlayers.forEach(uid => {
                      const move = moves[uid][stepIdx];
                      let {r, c} = newPos[uid];
                      if (move === 'up' && r > minB) r--;
                      else if (move === 'down' && r < maxB) r++;
                      else if (move === 'left' && c > minB) c--;
                      else if (move === 'right' && c < maxB) c++;
                      newPos[uid] = {r, c};

                      // Controllo collisione mina
                      const mineIdx = newMines.findIndex(m => m.r === r && m.c === c);
                      if (mineIdx !== -1) {
                          newMines.splice(mineIdx, 1);
                          newMineHits[uid] = (newMineHits[uid] || 0) + 1;
                          playSound('hit'); // Esplosione istantanea!
                      }
                  });

                  let nextPhase = `sim_${stepIdx + 1}`;
                  if (stepIdx === 2) nextPhase = 'sim_turn';

                  updateRoom({
                      'gameState.positions': newPos,
                      'gameState.mines': newMines,
                      'gameState.mineHits': newMineHits,
                      'gameState.phase': nextPhase
                  });
              }, 800);
              return () => clearTimeout(to);
          }
          else if (phase === 'sim_turn') {
              // Gestione Cambio Direzione e Calcolo Sparo simultaneo
              const to = setTimeout(() => {
                  let newFacing = { ...facing };
                  activePlayers.forEach(uid => {
                      newFacing[uid] = moves[uid][3]; // La mossa finale è lo sparo
                  });
                  
                  // Calcolo Traiettorie Laser e Danni ORA, così appaiono quando entriamo in sim_laser
                  playSound('laser');
                  let newBeams = [];
                  let damage = {};

                  activePlayers.forEach(shooter => {
                      const {r, c} = positions[shooter];
                      const dir = newFacing[shooter];
                      let dr = 0, dc = 0;
                      if (dir.includes('up')) dr = -1;
                      if (dir.includes('down')) dr = 1;
                      if (dir.includes('left')) dc = -1;
                      if (dir.includes('right')) dc = 1;
                      
                      // Aggiungiamo anche la cella da cui parte lo sparo
                      newBeams.push({ r, c, color: players[shooter].color, dir, isOrigin: true });
                      
                      let currR = r + dr;
                      let currC = c + dc;
                      
                      while (currR >= 0 && currR < 10 && currC >= 0 && currC < 10) {
                          newBeams.push({ r: currR, c: currC, color: players[shooter].color, dir, isOrigin: false });
                          
                          // Check hit
                          activePlayers.forEach(target => {
                              if (target !== shooter && positions[target].r === currR && positions[target].c === currC) {
                                  damage[target] = (damage[target] || 0) + 1;
                              }
                          });
                          
                          currR += dr;
                          currC += dc;
                      }
                  });

                  // Morte per caduta nel vuoto
                  if (gameState.roundCount >= 4) {
                      const minDmgB = gameState.roundCount >= 12 ? 2 : 1;
                      const maxDmgB = gameState.roundCount >= 12 ? 7 : 8;
                      activePlayers.forEach(uid => {
                          const { r, c } = positions[uid];
                          if (r < minDmgB || r > maxDmgB || c < minDmgB || c > maxDmgB) {
                              damage[uid] = (damage[uid] || 0) + 99; // Danno fatale
                          }
                      });
                  }

                  // Danni delle mine calpestati durante i movimenti
                  Object.entries(gameState.mineHits || {}).forEach(([uid, dmg]) => {
                      damage[uid] = (damage[uid] || 0) + dmg;
                  });

                  // Morte Improvvisa dal turno 18 in poi: tutti perdono 1 vita fissa a fine turno
                  if (gameState.roundCount >= 18) {
                      activePlayers.forEach(uid => {
                          damage[uid] = (damage[uid] || 0) + 1;
                      });
                  }

                  if (Object.keys(damage).length > 0) setTimeout(() => playSound('hit'), 200);

                  let newLives = { ...lives };
                  let newDead = [...deadPlayers];
                  let newFinished = [...gameState.finishedPlayers];

                  Object.entries(damage).forEach(([uid, dmg]) => {
                      newLives[uid] -= dmg;
                      if (newLives[uid] <= 0 && !newDead.includes(uid)) {
                          newDead.push(uid);
                          newFinished.push(uid); // Ordine inverso: il primo che muore va per primo in array
                      }
                  });

                  updateRoom({
                      'gameState.facing': newFacing,
                      'gameState.laserBeams': newBeams,
                      'gameState.hitsThisRound': damage,
                      'gameState.lives': newLives,
                      'gameState.deadPlayers': newDead,
                      'gameState.finishedPlayers': newFinished,
                      'gameState.phase': 'sim_laser'
                  });
              }, 800);
              return () => clearTimeout(to);
          }
          else if (phase === 'sim_laser') {
              // Manteniamo i laser e gli effetti a schermo per 2.5 secondi, per farli vedere bene a tutti!
              const to = setTimeout(() => {
                  updateRoom({
                      'gameState.phase': 'cleanup'
                  });
              }, 2500);
              return () => clearTimeout(to);
          }
          else if (phase === 'cleanup') {
              // Ripulisci la plancia e prepara il turno successivo
              const to = setTimeout(() => {
                  let firstAliveIdx = 0;
                  for (let i = 0; i < gameState.turnOrder.length; i++) {
                      if (!deadPlayers.includes(gameState.turnOrder[i])) {
                          firstAliveIdx = i;
                          break;
                      }
                  }
                  
                  const newRoundCount = (gameState.roundCount || 1) + 1;
                  let newMines = [...(gameState.mines || [])];
                  
                  if (newRoundCount === 8) {
                      // Spawna una mina in posizione casuale tra 1 e 8 solo all'inizio del round 8
                      let r = Math.floor(Math.random() * 8) + 1;
                      let c = Math.floor(Math.random() * 8) + 1;
                      newMines.push({r, c});
                  }

                  updateRoom({
                      'gameState.phase': 'programming',
                      'gameState.moves': {},
                      'gameState.laserBeams': [],
                      'gameState.hitsThisRound': {},
                      'gameState.activePlayerIndex': firstAliveIdx,
                      'gameState.roundCount': newRoundCount,
                      'gameState.mines': newMines,
                      'gameState.mineHits': {}
                  });
              }, 1500); // 1.5 secondi extra per vedere chi è morto prima del prossimo turno
              return () => clearTimeout(to);
          }

      }, [isHost, phase, moves, activePlayers, isGameOver]);

      const handleInput = (action) => {
          if (localMoves.length < 4) {
              setLocalMoves([...localMoves, action]);
          }
      };

      const undoMove = () => {
          if (localMoves.length > 0) {
              setLocalMoves(localMoves.slice(0, -1));
          }
      };

      const submitMoves = () => {
          if (localMoves.length === 4) {
              let updates = { [`gameState.moves.${user.uid}`]: localMoves };
              
              if (isLocal) {
                  let nextIdx = (gameState.activePlayerIndex + 1) % gameState.turnOrder.length;
                  let loop = 0;
                  while (deadPlayers.includes(gameState.turnOrder[nextIdx]) && loop < gameState.turnOrder.length) {
                      nextIdx = (nextIdx + 1) % gameState.turnOrder.length;
                      loop++;
                  }
                  updates['gameState.activePlayerIndex'] = nextIdx;
              }

              updateRoom(updates);
              setLocalMoves([]); // Reset locale
          }
      };

      // --- NUOVA LOGICA: Calcola posizione simulata per disabilitare bottoni ---
      const minB = gameState.roundCount >= 12 ? 2 : (gameState.roundCount >= 4 ? 1 : 0);
      const maxB = gameState.roundCount >= 12 ? 7 : (gameState.roundCount >= 4 ? 8 : 9);

      let btnSimR = positions[user.uid]?.r ?? 0;
      let btnSimC = positions[user.uid]?.c ?? 0;
      
      localMoves.forEach((move, idx) => {
          if (idx < 3) { // Calcola solo i movimenti (primi 3 slot)
              if (move === 'up' && btnSimR > minB) btnSimR--;
              else if (move === 'down' && btnSimR < maxB) btnSimR++;
              else if (move === 'left' && btnSimC > minB) btnSimC--;
              else if (move === 'right' && btnSimC < maxB) btnSimC++;
          }
      });

      const isMovementPhase = localMoves.length < 3;
      const disableUp = localMoves.length >= 4 || (isMovementPhase && btnSimR <= minB);
      const disableDown = localMoves.length >= 4 || (isMovementPhase && btnSimR >= maxB);
      const disableLeft = localMoves.length >= 4 || (isMovementPhase && btnSimC <= minB);
      const disableRight = localMoves.length >= 4 || (isMovementPhase && btnSimC >= maxB);
      const disableWait = localMoves.length >= 4 || localMoves.length === 3;
      const disableDiagonals = localMoves.length >= 4 || isMovementPhase;
      
      // Calcolo Fantasmi (Anteprima Percorso)
      let ghostR = positions[user.uid]?.r ?? 0;
      let ghostC = positions[user.uid]?.c ?? 0;
      const ghostPositions = [];
      let finalFacingGhost = null;
      
      const currentMovesToRender = moves[user.uid] || localMoves;

      currentMovesToRender.forEach((move, idx) => {
          if (idx < 3) {
              if (move === 'up' && ghostR > minB) ghostR--;
              else if (move === 'down' && ghostR < maxB) ghostR++;
              else if (move === 'left' && ghostC > minB) ghostC--;
              else if (move === 'right' && ghostC < maxB) ghostC++;
              ghostPositions.push({ r: ghostR, c: ghostC, step: idx + 1 });
          } else if (idx === 3) {
              finalFacingGhost = move;
          }
      });
      // -------------------------------------------------------------------------

      // Helper per icone movimenti
      const getActionIcon = (action, isShoot = false) => {
          if (action === 'wait') return <i className="fa-solid fa-circle-dot"></i>;
          const map = { 
              up: { icon: 'fa-arrow-up', rot: 0 }, 
              down: { icon: 'fa-arrow-down', rot: 0 }, 
              left: { icon: 'fa-arrow-left', rot: 0 }, 
              right: { icon: 'fa-arrow-right', rot: 0 },
              'up-left': { icon: 'fa-arrow-up', rot: -45 },
              'up-right': { icon: 'fa-arrow-up', rot: 45 },
              'down-left': { icon: 'fa-arrow-down', rot: 45 },
              'down-right': { icon: 'fa-arrow-down', rot: -45 }
          };
          const info = map[action];
          return <i className={`fa-solid ${info.icon} ${isShoot ? 'text-red-500' : ''}`} style={{transform: `rotate(${info.rot}deg)`}}></i>;
      };

      const myStatus = deadPlayers.includes(user.uid) ? 'dead' : moves[user.uid] ? 'ready' : 'programming';

      return (
        <div className="flex flex-col h-full gap-4 select-none">
          {/* HEADER */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center">
            <div>
               <div className="flex items-center gap-2">
                   <h2 className="text-xl font-bold text-red-500"><i className="fa-solid fa-crosshairs mr-2"></i>1... 2... 3... Spara!</h2>
                   <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase ${gameState.roundCount >= 18 ? 'bg-red-500/20 text-red-400 border border-red-500 animate-pulse' : 'bg-slate-700 text-slate-300'}`}>
                       Turno {gameState.roundCount || 1}
                   </span>
               </div>
               <p className="text-xs text-slate-400">
                   {gameState.roundCount >= 18 ? <span className="text-red-400 font-bold"><i className="fa-solid fa-skull"></i> Morte Improvvisa Attiva! -1 Vita fissa!</span> : 
                    gameState.roundCount === 17 ? <span className="text-amber-500 font-bold animate-pulse"><i className="fa-solid fa-triangle-exclamation"></i> Attenzione: Morte Improvvisa al prossimo round!</span> :
                    gameState.roundCount >= 12 ? <span className="text-red-400 font-bold"><i className="fa-solid fa-burst"></i> Secondo anello crollato!</span> :
                    gameState.roundCount === 11 ? <span className="text-amber-500 font-bold animate-pulse"><i className="fa-solid fa-triangle-exclamation"></i> Attenzione: Il secondo anello crolla al prossimo round!</span> :
                    (gameState.mines && gameState.mines.length > 0) ? <span className="text-rose-500 font-bold animate-pulse"><i className="fa-solid fa-bomb"></i> Mina attiva in campo!</span> : 
                    gameState.roundCount === 7 ? <span className="text-rose-500 font-bold animate-pulse"><i className="fa-solid fa-triangle-exclamation"></i> Attenzione: Spawnerà una mina al prossimo round!</span> :
                    gameState.roundCount >= 4 ? <span className="text-amber-500 font-bold"><i className="fa-solid fa-burst"></i> Bordo esterno crollato!</span> :
                    gameState.roundCount === 3 ? <span className="text-amber-500 font-bold animate-pulse"><i className="fa-solid fa-triangle-exclamation"></i> Attenzione: Il bordo esterno crolla al prossimo round!</span> :
                    'Pianifica le tue mosse per sopravvivere.'}
               </p>
            </div>
            
            <div className="flex gap-3 overflow-x-auto max-w-full pb-2 md:pb-0">
               {gameState.turnOrder.map(uid => {
                   const isDead = deadPlayers.includes(uid);
                   const isReady = moves[uid] && moves[uid].length === 4;
                   
                   return (
                       <div key={uid} className={`bg-slate-900 px-3 py-1 rounded-lg border-2 flex items-center gap-2 min-w-max relative transition-all ${isDead ? 'opacity-40 grayscale scale-95' : isReady ? 'border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'border-slate-700'}`} style={!isDead && !isReady ? {borderColor: players[uid].color} : {}}>
                          <img src={CHARACTERS.find(c=>c.id===players[uid].character)?.url} className="w-6 h-6 rounded-full" />
                          <div className="flex flex-col">
                             <span className={`text-[10px] font-bold ${isDead ? 'line-through' : ''}`}>{players[uid].nickname}</span>
                             <div className="flex gap-0.5">
                                 {[1,2,3].map(l => (
                                     <i key={l} className={`fa-solid fa-heart text-[8px] ${l <= lives[uid] ? 'text-red-500' : 'text-slate-700'}`}></i>
                                 ))}
                             </div>
                          </div>
                          {isReady && !isDead && phase === 'programming' && <i className="fa-solid fa-check absolute -top-2 -right-2 text-white bg-emerald-500 rounded-full p-1 text-[8px]"></i>}
                          {isDead && <i className="fa-solid fa-skull absolute -top-2 -right-2 text-white bg-slate-700 rounded-full p-1 text-[8px]"></i>}
                       </div>
                   )
               })}
            </div>
          </div>

          <div className="flex flex-col lg:flex-row gap-6 flex-1">
             
             {/* CONSOLE DI COMANDO */}
             <div className="lg:w-1/3 bg-slate-800 p-4 md:p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between min-h-[300px]">
                 
                 {myStatus === 'dead' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <i className="fa-solid fa-skull text-6xl text-slate-600 mb-4"></i>
                         <h3 className="text-2xl font-black text-slate-400">SEI MORTO</h3>
                         <p className="text-slate-500 mt-2">Goditi lo spettacolo e fai il tifo.</p>
                     </div>
                 ) : myStatus === 'ready' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <div className="w-24 h-24 bg-emerald-500/20 border-4 border-emerald-500 rounded-full flex items-center justify-center mb-4">
                            <i className="fa-solid fa-check text-5xl text-emerald-400"></i>
                         </div>
                         <h3 className="text-2xl font-black text-emerald-400">MOSSE CONFERMATE</h3>
                         <p className="text-slate-400 mt-2 animate-pulse">In attesa degli altri giocatori...</p>
                     </div>
                 ) : phase !== 'programming' ? (
                     <div className="flex flex-col items-center justify-center h-full text-center">
                         <i className="fa-solid fa-satellite-dish text-6xl text-indigo-400 mb-4 animate-pulse"></i>
                         <h3 className="text-2xl font-black text-indigo-400 uppercase tracking-widest">Azione!</h3>
                         <p className="text-slate-400 mt-2">Guarda l'arena per vedere i risultati.</p>
                     </div>
                 ) : (
                     <div className="flex flex-col h-full w-full">
                         <h3 className="text-xl font-bold text-center text-white mb-4">
                             {isLocal ? `Turno di ${players[user.uid]?.nickname}` : "Programma le Mosse"}
                         </h3>
                         
                         {/* Display Slot */}
                         <div className="flex justify-center gap-2 mb-6">
                             {[0, 1, 2, 3].map(i => {
                                 const isShoot = i === 3;
                                 const move = localMoves[i];
                                 return (
                                     <div key={i} className={`w-12 h-14 md:w-14 md:h-16 rounded-lg flex items-center justify-center text-2xl border-2 transition-all shadow-inner
                                         ${move ? (isShoot ? 'bg-red-900/50 border-red-500 text-red-400 shadow-[0_0_10px_rgba(239,68,68,0.3)]' : 'bg-indigo-900/50 border-indigo-400 text-indigo-300') : 
                                         'bg-slate-900 border-slate-600 text-slate-700'} 
                                         ${localMoves.length === i ? 'ring-2 ring-white animate-pulse' : ''}
                                     `}>
                                         {move ? getActionIcon(move, isShoot) : isShoot ? <i className="fa-solid fa-crosshairs text-sm opacity-30"></i> : (i+1)}
                                     </div>
                                 )
                             })}
                         </div>

                         {/* D-PAD Input */}
                         <div className="flex-1 flex flex-col items-center justify-center">
                             <div className="grid grid-cols-3 gap-1 md:gap-2 w-48">
                                 <button onClick={()=>handleInput('up-left')} disabled={disableDiagonals} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-up" style={{transform: 'rotate(-45deg)'}}></i></button>
                                 <button onClick={()=>handleInput('up')} disabled={disableUp} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-up"></i></button>
                                 <button onClick={()=>handleInput('up-right')} disabled={disableDiagonals} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-up" style={{transform: 'rotate(45deg)'}}></i></button>
                                 
                                 <button onClick={()=>handleInput('left')} disabled={disableLeft} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-left"></i></button>
                                 <button onClick={()=>handleInput('wait')} disabled={disableWait} className="bg-slate-800 border-2 border-slate-600 hover:bg-slate-700 active:bg-slate-600 disabled:opacity-30 p-3 md:p-4 rounded-lg text-xl flex items-center justify-center" title={localMoves.length === 3 ? "Non puoi sparare 'fermo'" : "Resta Fermo"}><i className="fa-solid fa-circle-dot"></i></button>
                                 <button onClick={()=>handleInput('right')} disabled={disableRight} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-right"></i></button>
                                 
                                 <button onClick={()=>handleInput('down-left')} disabled={disableDiagonals} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-down" style={{transform: 'rotate(45deg)'}}></i></button>
                                 <button onClick={()=>handleInput('down')} disabled={disableDown} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-down"></i></button>
                                 <button onClick={()=>handleInput('down-right')} disabled={disableDiagonals} className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 disabled:opacity-30 p-3 md:p-4 rounded-lg shadow border-b-4 border-slate-800 active:border-b-0 text-xl flex items-center justify-center"><i className="fa-solid fa-arrow-down" style={{transform: 'rotate(-45deg)'}}></i></button>
                             </div>
                         </div>

                         <div className="flex gap-2 mt-6">
                             <button onClick={undoMove} disabled={localMoves.length===0} className="flex-1 bg-red-900/50 hover:bg-red-800/50 disabled:opacity-50 text-red-300 py-3 rounded-lg font-bold"><i className="fa-solid fa-delete-left"></i> Cancella</button>
                             <button onClick={submitMoves} disabled={localMoves.length<4} className="flex-[2] bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white shadow-lg py-3 rounded-lg font-black transition-colors"><i className="fa-solid fa-satellite-dish mr-2"></i> TRASMETTI</button>
                         </div>
                     </div>
                 )}
             </div>

             {/* GRIGLIA DELL'ARENA (10x10) */}
             <div className="lg:w-2/3 bg-slate-900 p-2 md:p-6 rounded-xl border-4 flex items-center justify-center shadow-2xl relative overflow-hidden" style={{ borderColor: myStatus === 'dead' ? '#475569' : players[user.uid]?.color || '#334155' }}>
                
                {/* Background Decorativo Arena */}
                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'linear-gradient(#38bdf8 1px, transparent 1px), linear-gradient(90deg, #38bdf8 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                <div className="grid grid-cols-10 grid-rows-10 gap-px md:gap-1 w-full max-w-[500px] aspect-square relative z-10 bg-slate-800 p-1 border-2 border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.8)]">
                    
                    {/* Generazione Celle vuote */}
                    {Array.from({ length: 100 }).map((_, i) => {
